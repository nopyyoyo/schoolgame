<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>ไทยมอน — เข้าสู่ระบบ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="thaimon.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: linear-gradient(160deg, #e8f7e9, #cdeeda 60%, #b8e2c8);
      color: #1c3a24;
      font-family: Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    /* ---------- floating decor ---------- */
    .decor {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .decor .mon {
      position: absolute;
      background-size: 400% 100%;
      background-position: 0 0;
      background-repeat: no-repeat;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,.18));
      animation: floaty 5s ease-in-out infinite;
    }
    .decor .ball {
      position: absolute;
      border-radius: 50%;
      background: linear-gradient(180deg, #e63e30 0 44%, #1d1d1f 44% 56%, #f7f7f7 56% 100%);
      box-shadow: 0 8px 16px rgba(0,0,0,.22), inset -6px -8px 0 rgba(0,0,0,.12);
      animation: floaty 7s ease-in-out infinite;
    }
    .decor .ball::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 30%; height: 30%;
      transform: translate(-50%, -50%);
      background: #1d1d1f;
      border-radius: 50%;
    }
    .decor .ball::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 16%; height: 16%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px #d5d5d5;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-16px) rotate(4deg); }
    }
    @media (max-width: 560px) {
      .decor .mon { opacity: .55; }
      .decor .ball { opacity: .5; }
    }
    .card {
      width: min(100%, 400px);
      background: rgba(255, 253, 247, 0.28);
      backdrop-filter: blur(4px) saturate(1.3);
      -webkit-backdrop-filter: blur(4px) saturate(1.3);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 14px 40px rgba(30, 80, 40, 0.18);
      border: 3px solid rgba(123, 201, 111, 0.8);
      position: relative;
      z-index: 1;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 2.6rem;
      font-weight: 800;
      color: #2e7d32;
      margin: 0 0 4px;
    }
    .mini-ball {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: linear-gradient(180deg, #e63e30 0 44%, #1d1d1f 44% 56%, #f7f7f7 56% 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,.22), inset -3px -4px 0 rgba(0,0,0,.12);
      position: relative;
      animation: spin-ball 6s linear infinite;
    }
    .mini-ball::before {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 30%; height: 30%;
      transform: translate(-50%, -50%);
      background: #1d1d1f;
      border-radius: 50%;
    }
    .mini-ball::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      width: 15%; height: 15%;
      transform: translate(-50%, -50%);
      background: #fff;
      border-radius: 50%;
      box-shadow: inset 0 0 0 2px #d5d5d5;
    }
    @keyframes spin-ball {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .subtitle {
      text-align: center;
      color: #5a7a60;
      margin: 0 0 20px;
      font-size: 0.95rem;
    }
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      min-height: 48px;
      border: 2px solid #a5d6a7;
      border-radius: 14px;
      background: #f1f8e9;
      color: #2e7d32;
      font-family: inherit;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
    }
    .tab[aria-selected="true"] {
      background: #2e7d32;
      border-color: #2e7d32;
      color: #fff;
    }
    label {
      display: block;
      font-weight: 700;
      margin: 12px 0 6px;
      font-size: 0.95rem;
    }
    input {
      width: 100%;
      min-height: 52px;
      padding: 10px 14px;
      border: 2px solid #a5d6a7;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1.1rem;
      background: #fff;
      color: #1c3a24;
    }
    input:focus {
      outline: 3px solid #7bc96f;
      outline-offset: 1px;
      border-color: #2e7d32;
    }
    .submit {
      width: 100%;
      min-height: 56px;
      margin-top: 20px;
      border: 0;
      border-radius: 14px;
      background: #e45826;
      color: #fff;
      font-family: inherit;
      font-weight: 800;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 5px 0 #b23e14;
    }
    .submit:active { transform: translateY(3px); box-shadow: 0 2px 0 #b23e14; }
    .submit:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .msg {
      min-height: 1.5em;
      margin: 12px 0 0;
      text-align: center;
      font-weight: 700;
    }
    .msg.error { color: #c62828; }
    .msg.ok { color: #2e7d32; }
    .teacher-link {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #7a8a7d;
      font-size: 0.85rem;
      text-decoration: none;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="decor" aria-hidden="true">
    <div class="ball" style="width:130px;height:130px;top:6%;left:5%;"></div>
    <div class="ball" style="width:90px;height:90px;bottom:8%;right:6%;animation-delay:1.2s;"></div>
    <div class="ball" style="width:56px;height:56px;top:12%;right:12%;animation-delay:2.4s;"></div>
    <div class="mon" style="width:130px;height:130px;top:4%;right:4%;animation-delay:.6s;background-image:url('https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/butterfly_sprite.png');"></div>
    <div class="mon" style="width:150px;height:150px;bottom:5%;left:3%;animation-delay:1.8s;background-image:url('https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/elephant_sprite.png');"></div>
    <div class="mon" style="width:120px;height:120px;top:38%;left:1%;animation-delay:2.8s;background-image:url('https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/tiger_sprite.png');"></div>
    <div class="mon" style="width:120px;height:120px;top:42%;right:2%;animation-delay:3.6s;background-image:url('https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/monkey_sprite.png');"></div>
    <div class="mon" style="width:100px;height:100px;bottom:3%;right:22%;animation-delay:4.4s;background-image:url('https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/rabbit_sprite.png');"></div>
  </div>
  <main class="card">
    <h1 class="logo"><span class="mini-ball" aria-hidden="true"></span>ไทยมอน</h1>
    <p class="subtitle">สะสมมอนสเตอร์ของเธอ!</p>

    <div class="tabs" role="tablist">
      <button class="tab" id="tabSignin" role="tab" aria-selected="true" type="button">เข้าสู่ระบบ</button>
      <button class="tab" id="tabSignup" role="tab" aria-selected="false" type="button">สมัครสมาชิก</button>
    </div>

    <form id="formSignin" autocomplete="on">
      <label for="inUser">ชื่อผู้ใช้</label>
      <input id="inUser" type="text" autocomplete="username" maxlength="20" required>
      <label for="inPass">รหัสผ่าน</label>
      <input id="inPass" type="password" autocomplete="current-password" required>
      <button class="submit" type="submit" id="btnSignin">เข้าสู่ระบบ</button>
    </form>

    <form id="formSignup" hidden autocomplete="on">
      <label for="upUser">ชื่อผู้ใช้ (3–20 ตัวอักษร)</label>
      <input id="upUser" type="text" autocomplete="username" maxlength="20" required>
      <label for="upPass">รหัสผ่าน (อย่างน้อย 4 ตัวอักษร)</label>
      <input id="upPass" type="password" autocomplete="new-password" required>
      <label for="upPass2">ยืนยันรหัสผ่าน</label>
      <input id="upPass2" type="password" autocomplete="new-password" required>
      <label for="upCode">รหัสเชิญ (ครูให้มา)</label>
      <input id="upCode" type="text" autocomplete="off" required>
      <button class="submit" type="submit" id="btnSignup">สมัครสมาชิก</button>
    </form>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <a class="teacher-link" href="admin.html">สำหรับครู</a>
  </main>

  <script>
    (function () {
      'use strict';
      var tabSignin = document.getElementById('tabSignin');
      var tabSignup = document.getElementById('tabSignup');
      var formSignin = document.getElementById('formSignin');
      var formSignup = document.getElementById('formSignup');
      var msg = document.getElementById('msg');

      // already logged in? go to user page
      if (window.ThaiMon.getSession()) {
        window.location.href = 'user.html';
        return;
      }

      function showTab(which) {
        var isSignin = which === 'signin';
        tabSignin.setAttribute('aria-selected', isSignin ? 'true' : 'false');
        tabSignup.setAttribute('aria-selected', isSignin ? 'false' : 'true');
        formSignin.hidden = !isSignin;
        formSignup.hidden = isSignin;
        msg.textContent = '';
        msg.className = 'msg';
      }
      tabSignin.addEventListener('click', function () { showTab('signin'); });
      tabSignup.addEventListener('click', function () { showTab('signup'); });

      function say(text, isError) {
        msg.textContent = text;
        msg.className = 'msg ' + (isError ? 'error' : 'ok');
      }

      formSignin.addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = document.getElementById('btnSignin');
        btn.disabled = true;
        say('กำลังเข้าสู่ระบบ…', false);
        try {
          await window.ThaiMon.signin(
            document.getElementById('inUser').value,
            document.getElementById('inPass').value
          );
          window.location.href = 'user.html';
        } catch (err) {
          say(err.message || 'เกิดข้อผิดพลาด', true);
          btn.disabled = false;
        }
      });

      formSignup.addEventListener('submit', async function (e) {
        e.preventDefault();
        var p1 = document.getElementById('upPass').value;
        var p2 = document.getElementById('upPass2').value;
        if (p1 !== p2) { say('รหัสผ่านไม่ตรงกัน', true); return; }
        var btn = document.getElementById('btnSignup');
        btn.disabled = true;
        say('กำลังสมัครสมาชิก…', false);
        try {
          await window.ThaiMon.signup(
            document.getElementById('upUser').value,
            p1,
            document.getElementById('upCode').value
          );
          window.location.href = 'user.html';
        } catch (err) {
          say(err.message || 'เกิดข้อผิดพลาด', true);
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
