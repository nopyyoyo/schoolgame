<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>สุ่มกาชาปอง</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Tahoma, "Noto Sans Thai", sans-serif;
    background: linear-gradient(180deg, #3a2b5c 0%, #2b2145 60%, #1d1830 100%);
    color: #14213d;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: relative;
    width: min(100%, 480px);
    height: 100vh;
    height: 100svh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: .6rem;
    padding: .55rem .8rem;
    background: #fffdf4;
    border-bottom: 3px solid #e45826;
    z-index: 6;
  }
  .back { text-decoration: none; font-size: 1.7rem; line-height: 1; color: #1769aa; font-weight: bold; padding: 0 .2rem; }
  h1 { margin: 0; font-size: 1.25rem; flex: 1; }
  .gachas {
    background: #7b1fa2; color: #fff; font-weight: bold;
    padding: .25rem .75rem; border-radius: 999px; font-size: 1rem;
  }

  /* ---------- stage ---------- */
  #stage {
    position: relative; flex: 1; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding-top: 18px;
  }
  .stars-bg {
    position: absolute; inset: 0; pointer-events: none; opacity: .5;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff, transparent),
      radial-gradient(2px 2px at 60% 15%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 80% 45%, #fff, transparent),
      radial-gradient(2px 2px at 35% 65%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 75%, #fff, transparent),
      radial-gradient(2px 2px at 10% 85%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 50% 90%, #fff, transparent);
  }

  /* ---------- gachapon machine ---------- */
  #machine {
    position: relative; width: 230px; z-index: 2;
    cursor: pointer;
    transition: transform .12s;
  }
  #machine.shaking { animation: shake .7s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(0); }
    15% { transform: rotate(-4deg) translateY(-4px); }
    30% { transform: rotate(4deg); }
    45% { transform: rotate(-3deg) translateY(-3px); }
    60% { transform: rotate(3deg); }
    75% { transform: rotate(-2deg); }
  }
  .dome {
    width: 200px; height: 150px; margin: 0 auto;
    background: radial-gradient(ellipse at 50% 30%, rgba(255,255,255,.45), rgba(180,220,255,.12) 60%, rgba(140,190,240,.25));
    border: 6px solid #d32f2f;
    border-bottom: none;
    border-radius: 110px 110px 0 0;
    position: relative; overflow: hidden;
  }
  .capsule {
    position: absolute; width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(0,0,0,.25);
  }
  .cap-red    { background: linear-gradient(180deg, #ff6b6b 50%, #e8e8e8 50%); }
  .cap-blue   { background: linear-gradient(180deg, #4dabf7 50%, #e8e8e8 50%); }
  .cap-yellow { background: linear-gradient(180deg, #ffd43b 50%, #e8e8e8 50%); }
  .cap-green  { background: linear-gradient(180deg, #69db7c 50%, #e8e8e8 50%); }
  .cap-pink   { background: linear-gradient(180deg, #f783ac 50%, #e8e8e8 50%); }
  .cap-purple { background: linear-gradient(180deg, #b197fc 50%, #e8e8e8 50%); }
  .mid {
    width: 230px; height: 46px; margin: 0 auto;
    background: linear-gradient(180deg, #e53935, #b71c1c);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    box-shadow: 0 4px 0 #7f0000;
  }
  .crank {
    width: 44px; height: 44px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe082, #ff8f00);
    border: 3px solid #7f0000;
    position: relative;
    transition: transform .5s ease;
  }
  .crank::after {
    content: ""; position: absolute; left: 50%; top: 4px;
    width: 8px; height: 18px; margin-left: -4px;
    background: #5d4037; border-radius: 4px;
  }
  #machine.cranking .crank { transform: rotate(360deg); }
  .coin {
    width: 34px; height: 34px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff59d, #ffb300);
    border: 3px dashed #e65100;
    display: grid; place-items: center; font-size: 1.1rem; font-weight: bold; color: #e65100;
  }
  .body {
    width: 190px; margin: 0 auto;
    background: linear-gradient(180deg, #ef5350, #c62828);
    border-radius: 0 0 18px 18px;
    padding: 14px 0 18px;
    text-align: center;
    box-shadow: 0 6px 0 #7f0000;
  }
  .slot-door {
    width: 110px; height: 56px; margin: 0 auto;
    background: #4e342e; border-radius: 10px;
    border: 3px solid #3e2723;
    position: relative; overflow: visible;
  }
  .slot-label {
    color: #ffccbc; font-size: .8rem; margin-top: 6px; font-weight: bold;
  }

  /* ---------- dispensed capsule ---------- */
  #dropcapsule {
    position: absolute; z-index: 5;
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,.3);
    left: 50%; top: 0;
    transform: translateX(-50%);
    display: none;
    cursor: pointer;
    box-shadow: 0 8px 16px rgba(0,0,0,.4);
  }
  #dropcapsule.show { display: block; animation: drop .8s cubic-bezier(.3,1.4,.5,1) forwards; }
  @keyframes drop {
    0% { top: 300px; transform: translateX(-50%) scale(.6); }
    60% { top: 470px; transform: translateX(-50%) scale(1.05); }
    80% { top: 455px; transform: translateX(-50%) scale(1); }
    100% { top: 462px; transform: translateX(-50%) scale(1); }
  }
  #dropcapsule.opening { animation: capopen .5s ease forwards; }
  @keyframes capopen {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(2.2); opacity: 0; }
  }

  /* ---------- reveal ---------- */
  #reveal {
    position: absolute; inset: 0; z-index: 8;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(255,255,255,.14), transparent 65%);
    pointer-events: none;
  }
  #reveal.show { display: flex; }
  #revealSprite {
    width: min(62vw, 260px); aspect-ratio: 1;
    background-size: 400% 100%;
    background-repeat: no-repeat;
    background-position-x: 0%;
    animation: hop 2.4s steps(1) infinite, revealPop .6s cubic-bezier(.2,1.6,.4,1);
    filter: drop-shadow(0 12px 10px rgba(0,0,0,.4));
  }
  @keyframes hop {
    0%   { background-position-x: 0%; }
    15%  { background-position-x: 0%; }
    22%  { background-position-x: 33.3333%; }
    29%  { background-position-x: 66.6667%; }
    36%  { background-position-x: 100%; }
    92%  { background-position-x: 100%; }
    100% { background-position-x: 0%; }
  }
  @keyframes revealPop {
    0% { transform: scale(0) rotate(-30deg); }
    100% { transform: scale(1) rotate(0); }
  }
  #revealName {
    margin-top: 10px; font-size: 1.9rem; font-weight: bold; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #revealRank {
    margin-top: 6px; font-size: 1.1rem; font-weight: bold;
    padding: .2rem 1.1rem; border-radius: 999px; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .rank-S { background: linear-gradient(180deg, #ffd700, #ff8f00); }
  .rank-A { background: linear-gradient(180deg, #b388ff, #7c4dff); }
  .rank-B { background: linear-gradient(180deg, #64b5f6, #1976d2); }
  .rank-C { background: linear-gradient(180deg, #81c784, #388e3c); }
  .rank-D { background: linear-gradient(180deg, #b0bec5, #607d8b); }
  .rank-E, .rank-F, .rank-G, .rank-H { background: linear-gradient(180deg, #b0bec5, #607d8b); }

  .flash {
    position: absolute; inset: 0; z-index: 7; pointer-events: none;
    background: #fff; opacity: 0;
  }
  .flash.go { animation: flashA .45s ease forwards; }
  @keyframes flashA { 0% { opacity: 0; } 30% { opacity: .85; } 100% { opacity: 0; } }

  .star {
    position: absolute; z-index: 9; font-size: 26px; pointer-events: none;
    transform: translate(-50%,-50%);
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); opacity: 0; }
  }
  .confetti {
    position: absolute; top: -14px; width: 10px; height: 15px; z-index: 9;
    border-radius: 2px; pointer-events: none;
    animation: cfall linear forwards;
  }
  @keyframes cfall { to { transform: translateY(105vh) rotate(720deg); } }

  /* ---------- action area ---------- */
  #actions {
    position: relative; z-index: 6;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center;
    background: rgba(20,14,38,.6);
  }
  .btn {
    border: none; border-radius: 999px;
    padding: .7rem 1.6rem; font-size: 1.15rem; font-weight: bold; cursor: pointer;
    font-family: inherit; box-shadow: 0 4px 12px rgba(0,0,0,.35);
    color: #fff;
  }
  .btn:active { transform: scale(.95); }
  #rollBtn { background: linear-gradient(180deg, #ab47bc, #7b1fa2); font-size: 1.3rem; padding: .8rem 2.4rem; }
  #rollBtn:disabled { background: #757575; cursor: default; }
  #againBtn { background: linear-gradient(180deg, #66bb6a, #2e7d32); display: none; }
  #backBtn { background: linear-gradient(180deg, #78909c, #455a64); display: none; }
  #msg {
    text-align: center; color: #ffccbc; font-size: .95rem; min-height: 1.5em;
    padding: 0 16px 4px;
  }

  /* ---------- empty overlay ---------- */
  #nogacha {
    position: absolute; inset: 0; z-index: 20;
    background: rgba(18,12,32,.85);
    display: none; place-items: center;
  }
  #nogacha.show { display: grid; }
  .ng-card {
    background: #fffdf4; border-radius: 22px;
    border: 4px solid #7b1fa2;
    padding: 1.4rem 1.2rem; width: 86%; max-width: 340px;
    text-align: center;
  }
  .ng-title { font-size: 1.5rem; font-weight: bold; margin-bottom: .4rem; }
  .ng-sub { color: #52647a; margin-bottom: 1rem; font-size: .95rem; }
  #nogachaBack {
    background: #2f7d32; color: #fff; border: none; border-radius: 999px;
    padding: .65rem 2.2rem; font-size: 1.15rem; font-weight: bold; cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
<div id="game">
  <header>
    <a class="back" href="user.html" aria-label="กลับ">‹</a>
    <h1>🎰 สุ่มกาชาปอง</h1>
    <div class="gachas" id="gachacount">🎰 × …</div>
  </header>

  <div id="stage">
    <div class="stars-bg"></div>
    <div id="machine" role="button" tabindex="0" aria-label="แตะเพื่อสุ่มกาชาปอง">
      <div class="dome" id="dome"></div>
      <div class="mid">
        <div class="coin">G</div>
        <div class="crank" id="crank"></div>
      </div>
      <div class="body">
        <div class="slot-door" id="slotdoor"></div>
        <div class="slot-label">แตะเครื่องเพื่อสุ่ม!</div>
      </div>
    </div>
    <div id="dropcapsule"></div>
    <div class="flash" id="flash"></div>
    <div id="reveal">
      <div id="revealSprite"></div>
      <div id="revealName"></div>
      <div id="revealRank"></div>
    </div>
    <div id="nogacha">
      <div class="ng-card">
        <div class="ng-title">🎰 กาชาปองหมดแล้ว!</div>
        <div class="ng-sub">ไปขอคุณครูเพิ่มนะ</div>
        <button id="nogachaBack">กลับหน้าผู้ใช้</button>
      </div>
    </div>
  </div>

  <div id="msg"></div>
  <div id="actions">
    <button class="btn" id="rollBtn">สุ่ม! (1 🎰)</button>
    <button class="btn" id="againBtn">สุ่มอีกครั้ง</button>
    <button class="btn" id="backBtn">กลับ</button>
  </div>
</div>

<script src="thaimon.js"></script>
<script>
(function () {
  "use strict";

  var pid = window.ThaiMon.requireSession();
  if (!pid) return;

  var MONSTERS = [];  // { id, th, sprite_url, rank, weight }
  var gachapons = 0;
  var rolling = false;

  var machine = document.getElementById("machine");
  var dome = document.getElementById("dome");
  var dropcapsule = document.getElementById("dropcapsule");
  var reveal = document.getElementById("reveal");
  var revealSprite = document.getElementById("revealSprite");
  var revealName = document.getElementById("revealName");
  var revealRank = document.getElementById("revealRank");
  var flash = document.getElementById("flash");
  var msg = document.getElementById("msg");
  var rollBtn = document.getElementById("rollBtn");
  var againBtn = document.getElementById("againBtn");
  var backBtn = document.getElementById("backBtn");
  var gachacount = document.getElementById("gachacount");
  var stage = document.getElementById("stage");

  /* ---------- decorative capsules in the dome ---------- */
  var capColors = ["cap-red", "cap-blue", "cap-yellow", "cap-green", "cap-pink", "cap-purple"];
  var capSpots = [[18, 78], [58, 92], [100, 82], [138, 94], [38, 48], [80, 56], [120, 44], [150, 60], [62, 18], [105, 22]];
  capSpots.forEach(function (p, i) {
    var c = document.createElement("div");
    c.className = "capsule " + capColors[i % capColors.length];
    c.style.left = p[0] + "px";
    c.style.top = p[1] + "px";
    dome.appendChild(c);
  });

  /* ---------- sounds ---------- */
  var SFX = {
    ctx: null,
    ensure: function () {
      if (!this.ctx) {
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    },
    tone: function (freq, delay, dur, type, vol) {
      if (!this.ctx) return;
      var t = this.ctx.currentTime + delay;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    },
    crank: function () {
      this.ensure();
      for (var i = 0; i < 6; i++) this.tone(300 + i * 60, i * 0.08, 0.08, "square", 0.08);
    },
    drop: function () {
      this.ensure();
      this.tone(500, 0, 0.12, "sine", 0.15);
      this.tone(350, 0.12, 0.12, "sine", 0.12);
      this.tone(250, 0.24, 0.18, "sine", 0.12);
    },
    pop: function () {
      this.ensure();
      this.tone(620, 0, 0.07, "sine", 0.14);
      this.tone(930, 0.05, 0.09, "sine", 0.11);
    },
    fanfare: function () {
      this.ensure();
      var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      for (var i = 0; i < notes.length; i++) this.tone(notes[i], i * 0.1, 0.32, "triangle", 0.16);
    },
    rare: function () {
      this.ensure();
      var notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5, 1318.5, 1568];
      for (var i = 0; i < notes.length; i++) this.tone(notes[i], i * 0.13, 0.42, "triangle", 0.17);
    }
  };
  document.addEventListener("pointerdown", function () { SFX.ensure(); });

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function updateCount() {
    gachacount.textContent = "🎰 × " + gachapons;
    rollBtn.disabled = gachapons <= 0 || rolling;
  }
  function showBanner(text) { msg.textContent = text; }

  function starBurst(x, y, n) {
    for (var i = 0; i < (n || 12); i++) {
      var s = document.createElement("div");
      s.className = "star";
      s.textContent = "⭐";
      s.style.left = x + "px";
      s.style.top = y + "px";
      var ang = (i / (n || 12)) * Math.PI * 2 + Math.random() * 0.5;
      var dist = 80 + Math.random() * 70;
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      stage.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 950); })(s);
    }
  }
  function confetti() {
    var colors = ["#e45826", "#2f7d32", "#1769aa", "#f4d35e", "#ee3e36", "#9b59b6"];
    for (var i = 0; i < 42; i++) {
      var c = document.createElement("div");
      c.className = "confetti";
      c.style.background = colors[i % colors.length];
      c.style.left = Math.random() * 100 + "%";
      c.style.animationDuration = (2 + Math.random() * 2.2) + "s";
      c.style.animationDelay = (Math.random() * 0.9) + "s";
      stage.appendChild(c);
      (function (el) { setTimeout(function () { el.remove(); }, 5200); })(c);
    }
  }

  /* ---------- weighted random pick ---------- */
  function weightedPick() {
    var total = 0, i;
    for (i = 0; i < MONSTERS.length; i++) total += MONSTERS[i].weight;
    var r = Math.random() * total;
    for (i = 0; i < MONSTERS.length; i++) {
      r -= MONSTERS[i].weight;
      if (r <= 0) return MONSTERS[i];
    }
    return MONSTERS[MONSTERS.length - 1];
  }

  /* ---------- database ---------- */
  async function recordGacha(monsterId) {
    var c = window.ThaiMon.client();
    var p = await c.from("thaimon_players").select("gachapons").eq("id", pid).single();
    if (p.error) throw p.error;
    if (p.data.gachapons <= 0) return -1;
    var ng = p.data.gachapons - 1;
    var u = await c.from("thaimon_players").update({ gachapons: ng }).eq("id", pid);
    if (u.error) throw u.error;
    var ex = await c.from("thaimon_inventory").select("quantity")
      .eq("player_id", pid).eq("monster_id", monsterId).maybeSingle();
    if (ex.error) throw ex.error;
    if (ex.data) {
      var uu = await c.from("thaimon_inventory")
        .update({ quantity: ex.data.quantity + 1 })
        .eq("player_id", pid).eq("monster_id", monsterId);
      if (uu.error) throw uu.error;
    } else {
      var ins = await c.from("thaimon_inventory")
        .insert({ player_id: pid, monster_id: monsterId, quantity: 1 });
      if (ins.error) throw ins.error;
    }
    gachapons = ng;
    updateCount();
    return ng;
  }

  /* ---------- roll sequence ---------- */
  async function roll() {
    if (rolling) return;
    if (gachapons <= 0) {
      document.getElementById("nogacha").classList.add("show");
      return;
    }
    rolling = true;
    updateCount();
    showBanner("");
    reveal.classList.remove("show");
    againBtn.style.display = "none";
    backBtn.style.display = "none";

    // 1. crank + shake
    machine.classList.add("cranking");
    SFX.crank();
    await wait(550);
    machine.classList.remove("cranking");
    machine.classList.add("shaking");
    await wait(750);
    machine.classList.remove("shaking");

    // 2. pick monster NOW (result decided, animation is just show)
    var mon = weightedPick();

    // 3. consume gachapon + save to inventory
    try {
      var left = await recordGacha(mon.id);
      if (left < 0) {
        document.getElementById("nogacha").classList.add("show");
        rolling = false;
        updateCount();
        return;
      }
    } catch (e) {
      showBanner("บันทึกไม่ได้ ลองอีกครั้งนะ");
      rolling = false;
      updateCount();
      return;
    }

    // 4. capsule drops
    var capColor = capColors[Math.floor(Math.random() * capColors.length)];
    dropcapsule.className = "";
    dropcapsule.classList.add(capColor);
    void dropcapsule.offsetWidth;
    dropcapsule.classList.add("show");
    SFX.drop();
    await wait(900);
    showBanner("แตะแคปซูลเพื่อเปิด!");

    // 5. tap capsule to open
    await new Promise(function (resolve) {
      function onTap(e) {
        e.stopPropagation();
        dropcapsule.removeEventListener("pointerdown", onTap);
        resolve();
      }
      dropcapsule.addEventListener("pointerdown", onTap);
    });

    // 6. flash + reveal
    dropcapsule.classList.add("opening");
    SFX.pop();
    await wait(250);
    flash.classList.remove("go");
    void flash.offsetWidth;
    flash.classList.add("go");
    dropcapsule.classList.remove("show");
    dropcapsule.classList.remove("opening");

    revealSprite.style.backgroundImage = 'url("' + mon.sprite_url + '")';
    revealName.textContent = mon.th;
    revealRank.textContent = "แรงค์ " + mon.rank;
    revealRank.className = "rank-" + mon.rank;
    reveal.classList.remove("show");
    void reveal.offsetWidth;
    reveal.classList.add("show");

    var sr = revealSprite.getBoundingClientRect();
    var fr = stage.getBoundingClientRect();
    starBurst(sr.left - fr.left + sr.width / 2, sr.top - fr.top + sr.height / 2, 14);

    if (mon.rank === "S" || mon.rank === "A") {
      SFX.rare();
      confetti();
      showBanner("🌟 หายากมาก! " + mon.th + " 🌟");
    } else {
      SFX.fanfare();
      showBanner("ได้ " + mon.th + "!");
    }

    await wait(600);
    rolling = false;
    updateCount();
    if (gachapons > 0) {
      againBtn.style.display = "";
    } else {
      backBtn.style.display = "";
      showBanner("กาชาปองหมดแล้ว!");
    }
  }

  rollBtn.addEventListener("click", roll);
  machine.addEventListener("pointerdown", function () { if (!rolling) roll(); });
  againBtn.addEventListener("click", roll);
  backBtn.addEventListener("click", function () { window.location.href = "user.html"; });
  document.getElementById("nogachaBack").addEventListener("click", function () {
    window.location.href = "user.html";
  });

  /* ---------- init ---------- */
  async function init() {
    try {
      var p = await window.ThaiMon.getPlayer(pid);
      gachapons = p.gachapons || 0;
      var m = await window.ThaiMon.client()
        .from("thaimon_monsters")
        .select("id, name_th, sprite_url, rank, gacha_weight")
        .gt("gacha_weight", 0)
        .order("rank");
      if (m.error) throw m.error;
      MONSTERS = (m.data || []).map(function (r) {
        return { id: r.id, th: r.name_th, sprite_url: r.sprite_url, rank: r.rank, weight: r.gacha_weight };
      });
      if (!MONSTERS.length) {
        showBanner("ยังไม่มีมอนสเตอร์ในกาชาปอง");
        rollBtn.disabled = true;
        return;
      }
    } catch (e) {
      showBanner("โหลดข้อมูลไม่ได้");
      rollBtn.disabled = true;
      return;
    }
    updateCount();
    if (gachapons <= 0) {
      document.getElementById("nogacha").classList.add("show");
    }
  }
  init();
})();
</script>
</body>
</html>
