<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>สุ่มสิ่งของในห้องเรียน</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f8ed;
      --ink: #17352e;
      --muted: #52665f;
      --surface: #ffffff;
      --line: #d9e1d5;
      --green: #177456;
      --green-press: #0e5d43;
      --yellow: #ffd85a;
      --shadow: 0 18px 50px rgba(36, 73, 58, .13);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101a17;
        --ink: #eef6f1;
        --muted: #b1c1ba;
        --surface: #192722;
        --line: #334740;
        --green: #58c69a;
        --green-press: #72d9ae;
        --yellow: #f2ca4d;
        --shadow: 0 20px 54px rgba(0, 0, 0, .32);
      }
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px),
        var(--bg);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: Tahoma, "Noto Sans Thai", sans-serif;
      overflow-x: hidden;
    }
    button { font: inherit; }
    .app {
      min-height: 100svh;
      width: min(100%, 760px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
    }
    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .prompt {
      margin: 0;
      color: var(--muted);
      font-size: clamp(.92rem, 3.6vw, 1.05rem);
      font-weight: 700;
    }
    .sound-toggle {
      min-width: 44px;
      min-height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: var(--surface);
      cursor: pointer;
      box-shadow: 0 3px 0 var(--line);
      -webkit-tap-highlight-color: transparent;
    }
    .sound-toggle:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
    .sound-toggle svg { width: 22px; height: 22px; }
    .sound-toggle .sound-off { display: none; }
    .sound-toggle[aria-pressed="false"] .sound-on { display: none; }
    .sound-toggle[aria-pressed="false"] .sound-off { display: block; }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(100%, 520px);
      height: min(64svh, 610px);
      min-height: 390px;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 30px 30px 18px 18px;
      overflow: hidden;
      box-shadow: var(--shadow), 0 8px 0 var(--green);
      position: relative;
    }
    .image-wrap {
      min-height: 0;
      padding: clamp(22px, 5vw, 42px);
      display: grid;
      place-items: center;
      background: #fff;
      position: relative;
      overflow: hidden;
    }
    .image-wrap::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 2px dashed #dce8df;
      border-radius: 21px;
      pointer-events: none;
    }
    #objectImage {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      max-height: 390px;
      object-fit: contain;
      filter: drop-shadow(0 12px 13px rgba(20, 45, 35, .13));
      user-select: none;
      -webkit-user-drag: none;
    }
    .label {
      min-height: 114px;
      display: grid;
      place-items: center;
      padding: 18px 20px 20px;
      background: var(--surface);
      border-top: 1px solid var(--line);
    }
    #objectWord {
      margin: 0;
      font-size: clamp(2.6rem, 11vw, 4.8rem);
      line-height: 1.05;
      letter-spacing: -.03em;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
    }
    .card.shuffling #objectImage { filter: saturate(.92); }
    .card.shuffling #objectWord { color: var(--green); }
    .card.landed { animation: settle .55s cubic-bezier(.2,.9,.25,1.25); }
    @keyframes settle {
      0% { transform: translateY(0) rotate(0); }
      35% { transform: translateY(-8px) rotate(-.6deg); }
      68% { transform: translateY(3px) rotate(.3deg); }
      100% { transform: translateY(0) rotate(0); }
    }

    .controls {
      display: grid;
      justify-items: center;
      gap: 10px;
    }
    .shuffle-button {
      width: min(100%, 520px);
      min-height: 62px;
      border: 0;
      border-radius: 18px;
      background: var(--green);
      color: #fff;
      font-size: clamp(1.12rem, 4.6vw, 1.34rem);
      font-weight: 800;
      letter-spacing: .01em;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--green-press);
      transition: transform .12s ease, box-shadow .12s ease, opacity .2s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    @media (prefers-color-scheme: dark) {
      .shuffle-button { color: #082218; }
    }
    .shuffle-button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-press); }
    .shuffle-button:focus-visible, .sound-toggle:focus-visible, .credits-button:focus-visible {
      outline: 4px solid var(--yellow);
      outline-offset: 3px;
    }
    .shuffle-button:disabled { cursor: wait; opacity: .82; }
    .credits-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      font-size: .78rem;
      min-height: 32px;
      cursor: pointer;
    }

    dialog {
      width: min(calc(100% - 32px), 560px);
      max-height: min(78svh, 650px);
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 0;
      box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(7, 18, 14, .68); }
    .credits-head {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .credits-head h2 { margin: 0; font-size: 1.18rem; }
    .close-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: var(--bg);
      color: var(--ink);
      font-size: 1.5rem;
      cursor: pointer;
    }
    .credits-list { margin: 0; padding: 14px 22px 22px 42px; }
    .credits-list li { padding: 6px 0; }
    .credits-list a { color: var(--green); font-weight: 700; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-height: 650px) {
      .app { gap: 10px; padding-top: 10px; }
      .card { min-height: 300px; height: min(60svh, 430px); }
      .label { min-height: 82px; padding: 10px 16px 12px; }
      .image-wrap { padding: 18px; }
      .shuffle-button { min-height: 54px; }
      .credits-button { min-height: 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card.landed { animation: none; }
      .shuffle-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">
      <p class="prompt">ดูรูป แล้วอ่านคำให้ดัง!</p>
      <button class="sound-toggle" id="soundToggle" type="button" aria-label="ปิดเสียง" aria-pressed="true">
        <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3Zm12.5 3a3.5 3.5 0 0 0-1.7-3v6a3.5 3.5 0 0 0 1.7-3Zm-1.7-7.7v2.1a6 6 0 0 1 0 11.2v2.1a8 8 0 0 0 0-15.4Z"/></svg>
        <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9H3Zm12.6 3 2.2-2.2-1.4-1.4-2.2 2.2L12 8.4 10.6 9.8l2.2 2.2-2.2 2.2 1.4 1.4 2.2-2.2 2.2 2.2 1.4-1.4-2.2-2.2Z"/></svg>
      </button>
    </div>

    <section class="stage" aria-label="สิ่งของที่สุ่มได้">
      <div class="card" id="card">
        <div class="image-wrap">
          <img id="objectImage" src="../Small%20games/object%20photo/backpack.png" alt="กระเป๋านักเรียน" width="800" height="600" />
        </div>
        <div class="label"><p id="objectWord">กระเป๋า</p></div>
      </div>
      <p class="sr-only" id="resultStatus" aria-live="polite"></p>
    </section>

    <div class="controls">
      <button class="shuffle-button" id="shuffleButton" type="button">เริ่มสุ่ม</button>
      <button class="credits-button" id="creditsButton" type="button">ที่มารูปภาพ</button>
    </div>
  </main>

  <dialog id="creditsDialog">
    <div class="credits-head">
      <h2>ที่มารูปภาพ</h2>
      <button class="close-button" id="closeCredits" type="button" aria-label="ปิด">×</button>
    </div>
    <ol class="credits-list">
      <li><a href="https://www.Vecteezy.com/free-photos/school-backpack" target="_blank" rel="noopener">กระเป๋า — Vecteezy</a></li>
      <li><a href="https://www.Vecteezy.com/free-photos/rectangle-button" target="_blank" rel="noopener">ยางลบ — Vecteezy</a></li>
      <li><a href="https://mahik.ua/linijka-derevyana-30sm-harkiv" target="_blank" rel="noopener">ไม้บรรทัด — Mahik</a></li>
      <li><a href="https://www.Vecteezy.com/photo/49939323-white-background-macro-ink-writing-instrument-office-supplies-tool-stationery-item-penmanship-ballpoint-pen-creativity-isolated-ballpoint-pen-with-blue-cap-on-white-background" target="_blank" rel="noopener">ปากกา — Vecteezy</a></li>
      <li><a href="https://www.Vecteezy.com/photo/50630712-yellow-pencil-isolated-on-white-background" target="_blank" rel="noopener">ดินสอ — Vecteezy</a></li>
      <li><a href="https://alingar.ru/product/code_98620/" target="_blank" rel="noopener">สมุด — Alingar</a></li>
      <li><a href="https://jooinn.com/books-isolated.html" target="_blank" rel="noopener">หนังสือ — Jooinn</a></li>
      <li><a href="https://noithathoaphatvn.net/danh-muc/noi-that-truong-hoc/" target="_blank" rel="noopener">โต๊ะ — Hòa Phát</a></li>
      <li><a href="https://www.navarroaubanell.com/producto/silla-dosca-escuela-navarroaubanell/" target="_blank" rel="noopener">เก้าอี้ — Navarro Aubanell</a></li>
    </ol>
  </dialog>

  <script>
    (function () {
      var objects = [
        { word: "กระเป๋า", image: "../Small%20games/object%20photo/backpack.png", alt: "กระเป๋านักเรียน" },
        { word: "ยางลบ", image: "../Small%20games/object%20photo/eraser.png", alt: "ยางลบสีชมพู" },
        { word: "ไม้บรรทัด", image: "../Small%20games/object%20photo/ruler.png", alt: "ไม้บรรทัดไม้" },
        { word: "ปากกา", image: "../Small%20games/object%20photo/pen.png", alt: "ปากกาลูกลื่นสีน้ำเงิน" },
        { word: "ดินสอ", image: "../Small%20games/object%20photo/pencil.png", alt: "ดินสอสีเหลือง" },
        { word: "สมุด", image: "../Small%20games/object%20photo/notebook.png", alt: "สมุดเรียน" },
        { word: "หนังสือ", image: "../Small%20games/object%20photo/book.png", alt: "หนังสือ" },
        { word: "โต๊ะ", image: "../Small%20games/object%20photo/table.png", alt: "โต๊ะนักเรียน" },
        { word: "เก้าอี้", image: "../Small%20games/object%20photo/chair.png", alt: "เก้าอี้นักเรียน" }
      ];

      var image = document.getElementById("objectImage");
      var word = document.getElementById("objectWord");
      var card = document.getElementById("card");
      var button = document.getElementById("shuffleButton");
      var soundToggle = document.getElementById("soundToggle");
      var resultStatus = document.getElementById("resultStatus");
      var creditsDialog = document.getElementById("creditsDialog");
      var currentIndex = 0;
      var lastFinalIndex = 0;
      var running = false;
      var soundOn = true;
      var audioContext = null;

      objects.forEach(function (item) {
        var preload = new Image();
        preload.src = item.image;
      });

      function showItem(index) {
        var item = objects[index];
        image.src = item.image;
        image.alt = item.alt;
        word.textContent = item.word;
        currentIndex = index;
      }

      function randomDifferent(excluded) {
        var index;
        do { index = Math.floor(Math.random() * objects.length); }
        while (index === excluded);
        return index;
      }

      function ensureAudio() {
        if (!audioContext) {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioContext = new AudioCtx();
        }
        if (audioContext && audioContext.state === "suspended") audioContext.resume();
      }

      function tone(frequency, duration, volume, type, delay) {
        if (!soundOn || !audioContext) return;
        var start = audioContext.currentTime + (delay || 0);
        var oscillator = audioContext.createOscillator();
        var gain = audioContext.createGain();
        oscillator.type = type || "sine";
        oscillator.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        oscillator.start(start);
        oscillator.stop(start + duration + 0.02);
      }

      function tick(step) {
        tone(330 + (step % 3) * 55, .045, .055, "square", 0);
      }

      function finishSound() {
        tone(523.25, .32, .12, "sine", 0);
        tone(659.25, .34, .1, "sine", .09);
        tone(783.99, .42, .09, "sine", .18);
      }

      function shuffle() {
        if (running) return;
        running = true;
        ensureAudio();
        button.disabled = true;
        button.textContent = "กำลังสุ่ม…";
        resultStatus.textContent = "";
        card.classList.remove("landed");
        card.classList.add("shuffling");
        var totalSteps = 27;
        var step = 0;

        function advance() {
          var next = randomDifferent(currentIndex);
          if (step === totalSteps - 1 && next === lastFinalIndex) next = randomDifferent(lastFinalIndex);
          showItem(next);
          tick(step);
          step += 1;

          if (step < totalSteps) {
            var progress = step / totalSteps;
            var delay = 48 + Math.pow(progress, 2.8) * 430;
            window.setTimeout(advance, delay);
          } else {
            lastFinalIndex = currentIndex;
            running = false;
            card.classList.remove("shuffling");
            void card.offsetWidth;
            card.classList.add("landed");
            button.disabled = false;
            button.textContent = "สุ่มอีกครั้ง";
            finishSound();
            resultStatus.textContent = "สุ่มได้ " + objects[currentIndex].word;
          }
        }
        advance();
      }

      button.addEventListener("click", shuffle);
      soundToggle.addEventListener("click", function () {
        soundOn = !soundOn;
        soundToggle.setAttribute("aria-pressed", soundOn ? "true" : "false");
        soundToggle.setAttribute("aria-label", soundOn ? "ปิดเสียง" : "เปิดเสียง");
        if (soundOn) {
          ensureAudio();
          tone(520, .09, .06, "sine", 0);
        }
      });
      document.getElementById("creditsButton").addEventListener("click", function () {
        creditsDialog.showModal();
      });
      document.getElementById("closeCredits").addEventListener("click", function () {
        creditsDialog.close();
      });
      creditsDialog.addEventListener("click", function (event) {
        var rect = creditsDialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) creditsDialog.close();
      });
    }());
  </script>
</body>
</html>
