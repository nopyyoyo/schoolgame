<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>จับสัตว์</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Tahoma, "Noto Sans Thai", sans-serif;
    background: #1d5c2a;
    color: #14213d;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: relative;
    width: min(100%, 480px);
    height: 100vh;
    height: 100svh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,.35);
    background: #fffdf4;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: .6rem;
    padding: .55rem .8rem;
    background: #fffdf4;
    border-bottom: 3px solid #e45826;
    z-index: 6;
  }
  .back { text-decoration: none; font-size: 1.7rem; line-height: 1; color: #1769aa; font-weight: bold; padding: 0 .2rem; }
  h1 { margin: 0; font-size: 1.25rem; flex: 1; }
  .progress {
    background: #e45826; color: #fff; font-weight: bold;
    padding: .25rem .75rem; border-radius: 999px; font-size: 1rem;
  }

  /* ---------- collection tray ---------- */
  #tray {
    display: flex; gap: 6px; align-items: center;
    padding: .45rem .8rem;
    background: #fffdf4;
    border-bottom: 1px solid #e8e0cf;
    z-index: 6;
  }
  #tray .label { font-size: .82rem; color: #52647a; white-space: nowrap; }
  .slot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px dashed #b9c8d8; background: #f2f6fa;
    display: grid; place-items: center; overflow: hidden;
    font-size: 0;
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- field ---------- */
  #field {
    position: relative; flex: 1; overflow: hidden;
    background: linear-gradient(180deg, #8fd45e 0%, #6fbf4a 30%, #57a83c 65%, #4a9334 100%);
    touch-action: manipulation;
  }
  #field::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(20,60,20,.32) 100%);
  }
  .treeline {
    position: absolute; top: -10px; left: 0; right: 0; z-index: 1;
    display: flex; justify-content: space-around; align-items: flex-end;
    pointer-events: none;
  }
  .tree-side { position: absolute; top: 5%; z-index: 1; pointer-events: none; }
  .tree-side.left { left: -16px; }
  .tree-side.right { right: -16px; }
  .tree-side svg { animation: sway 5.5s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
  .tuft { position: absolute; z-index: 2; pointer-events: none; opacity: .95; }
  .clearing {
    position: absolute; left: 50%; top: 32%; z-index: 2;
    width: min(84vw, 330px); height: min(30vw, 120px);
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(255,255,255,.28), transparent 70%);
    pointer-events: none;
  }

  /* ---------- encounter banner ---------- */
  #banner {
    position: absolute; top: 14px; left: 50%; z-index: 4;
    transform: translateX(-50%) translateY(-90px);
    background: #fffdf4; border: 3px solid #e45826; border-radius: 999px;
    padding: .35rem 1.2rem; font-weight: bold; font-size: 1.05rem; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
  }
  #banner.show { animation: bannerIn 2.2s ease forwards; }
  @keyframes bannerIn {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-90px); }
    12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    80%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-34px); }
  }

  /* ---------- animal ---------- */
  #spot {
    position: absolute; left: 50%; top: 32%; z-index: 3;
    width: min(56vw, 230px);
    transform: translate(-50%, -50%);
  }
  #spot .ring {
    width: 100%; aspect-ratio: 1; border-radius: 50%;
    background: #fff; border: 6px solid #2f7d32;
    box-shadow: 0 12px 24px rgba(0,0,0,.3), inset 0 0 0 4px #dff1ff;
    overflow: hidden;
    position: relative;
  }
  #spot .ring img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #sprite {
    position: absolute; inset: 0;
    background-size: 400% 100%;
    background-repeat: no-repeat;
    background-position-x: 0%;
    animation: hop 2.4s steps(1) infinite;
  }
  @keyframes hop {
    0%   { background-position-x: 0%; }
    15%  { background-position-x: 0%; }
    22%  { background-position-x: 33.3333%; }
    29%  { background-position-x: 66.6667%; }
    36%  { background-position-x: 100%; }
    92%  { background-position-x: 100%; }
    100% { background-position-x: 0%; }
  }
  #spot.pop .ring { animation: pop .55s ease; }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #spot .shadow {
    position: absolute; top: calc(100% + 10px); left: 50%;
    width: 72%; height: 20px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,.35), transparent 70%);
    animation: shadowHop 2.4s ease-in-out infinite;
  }
  @keyframes shadowHop {
    0%, 12%  { transform: translateX(-50%) scale(1); opacity: .8; }
    24%      { transform: translateX(-50%) scale(.68); opacity: .45; }
    38%, 100% { transform: translateX(-50%) scale(1); opacity: .8; }
  }
  #namepill {
    position: absolute; top: calc(100% + 38px); left: 50%;
    transform: translateX(-50%);
    background: #fffdf4; border: 3px solid #1769aa; border-radius: 999px;
    padding: .3rem 1.3rem; font-size: 1.35rem; font-weight: bold; white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }

  /* ---------- pokeball ---------- */
  #ballzone {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center; z-index: 4;
  }
  #pokeball {
    width: 78px; height: 78px; border-radius: 50%; margin: 0 auto;
    background: linear-gradient(180deg, #ee3e36 0 46%, #222 46% 54%, #f8f8f8 54% 100%);
    border: 4px solid #222;
    position: relative; cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
    touch-action: manipulation;
  }
  #pokeball::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 22px; height: 22px; transform: translate(-50%,-50%);
    background: #fff; border: 4px solid #222; border-radius: 50%;
  }
  #pokeball:active { transform: scale(.9); }
  #hint {
    margin-top: 8px; color: #fff; font-size: .95rem;
    text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }

  @media (prefers-reduced-motion: reduce) {
    #sprite, #spot .shadow, .tree-side svg { animation: none; }
  }
</style>
</head>
<body>
<div id="game">
  <header>
    <a class="back" href="../" aria-label="กลับ">‹</a>
    <h1>⚾ จับสัตว์</h1>
    <div class="progress" id="progress">0/10</div>
  </header>
  <div id="tray"><span class="label">ที่จับได้:</span></div>

  <div id="field">
    <div class="treeline" id="treeline"></div>
    <div class="tree-side left" id="treeL"></div>
    <div class="tree-side right" id="treeR"></div>
    <div class="clearing"></div>
    <div id="banner"></div>

    <div id="spot">
      <div class="ring"><img id="animalimg" alt="สัตว์ป่า" /><div id="sprite"></div></div>
      <div class="shadow"></div>
      <div id="namepill">…</div>
    </div>

    <div id="ballzone">
      <div id="pokeball" role="button" tabindex="0" aria-label="สุ่มสัตว์ตัวใหม่"></div>
      <div id="hint">แตะบอลเพื่อเจอสัตว์ตัวใหม่</div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ANIMALS = [
    { id: "elephant",  th: "ช้าง" },
    { id: "tiger",     th: "เสือ" },
    { id: "lion",      th: "สิงโต" },
    { id: "dog",       th: "หมา" },
    { id: "cat",       th: "แมว" },
    { id: "bird",      th: "นก" },
    { id: "fish",      th: "ปลา" },
    { id: "monkey",    th: "ลิง" },
    { id: "rabbit",    th: "กระต่าย" },
    { id: "horse",     th: "ม้า" },
    { id: "cow",       th: "วัว" },
    { id: "pig",       th: "หมู" },
    { id: "chicken",   th: "ไก่" },
    { id: "duck",      th: "เป็ด" },
    { id: "butterfly", th: "ผีเสื้อ" }
  ];
  var IMG = function (id) {
    return "https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/" + id + ".jpg";
  };
  var SPRITE_IMG = function (id) {
    return "https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/" + id + "_sprite.png";
  };

  /* ---------- scenery ---------- */
  function treeSVG(c1, c2) {
    return '<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="44" y="82" width="12" height="48" rx="4" fill="#7a5230"/>' +
      '<circle cx="50" cy="52" r="34" fill="' + c1 + '"/>' +
      '<circle cx="28" cy="68" r="22" fill="' + c2 + '"/>' +
      '<circle cx="72" cy="68" r="22" fill="' + c2 + '"/>' +
      '<circle cx="50" cy="34" r="15" fill="' + c2 + '" opacity="0.65"/></svg>';
  }
  function tuftSVG() {
    return '<svg viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M6 32 Q9 18 5 6 M16 32 Q17 14 21 4 M26 32 Q27 16 33 8 M34 32 Q37 20 39 12"' +
      ' stroke="#3f8f31" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>';
  }

  var treeline = document.getElementById("treeline");
  var backTrees = [
    { w: 52, c: ["#2c6e2e", "#35823a"] }, { w: 66, c: ["#265e28", "#2f7d32"] },
    { w: 48, c: ["#2c6e2e", "#35823a"] }, { w: 62, c: ["#265e28", "#2f7d32"] },
    { w: 54, c: ["#2c6e2e", "#35823a"] }, { w: 60, c: ["#265e28", "#2f7d32"] }
  ];
  backTrees.forEach(function (t) {
    var s = document.createElement("span");
    s.innerHTML = treeSVG(t.c[0], t.c[1]);
    s.firstChild.setAttribute("width", t.w);
    s.firstChild.setAttribute("height", t.w * 1.4);
    treeline.appendChild(s);
  });
  document.getElementById("treeL").innerHTML = treeSVG("#2f7d32", "#3a9a40")
    .replace("<svg", '<svg width="104" height="146"');
  document.getElementById("treeR").innerHTML = treeSVG("#2f7d32", "#3a9a40")
    .replace("<svg", '<svg width="92" height="129"');

  var field = document.getElementById("field");
  var tuftSpots = [
    [6, 62], [20, 78], [36, 68], [55, 80], [70, 64], [84, 76], [12, 88], [46, 90], [78, 90]
  ];
  tuftSpots.forEach(function (p) {
    var d = document.createElement("div");
    d.className = "tuft";
    d.style.left = p[0] + "%";
    d.style.top = p[1] + "%";
    d.innerHTML = tuftSVG();
    field.appendChild(d);
  });

  /* ---------- collection tray (10 slots, filled in later steps) ---------- */
  var tray = document.getElementById("tray");
  for (var s = 0; s < 10; s++) {
    var slot = document.createElement("div");
    slot.className = "slot";
    tray.appendChild(slot);
  }

  /* ---------- encounters ---------- */
  var img = document.getElementById("animalimg");
  var sprite = document.getElementById("sprite");
  var spot = document.getElementById("spot");
  var banner = document.getElementById("banner");
  var namepill = document.getElementById("namepill");
  var ball = document.getElementById("pokeball");

  // Preload all animal photos so encounters appear instantly.
  ANIMALS.forEach(function (a) { var i = new Image(); i.src = IMG(a.id); });

  var current = -1;
  function spawn() {
    var i;
    do { i = Math.floor(Math.random() * ANIMALS.length); } while (i === current);
    current = i;
    var a = ANIMALS[i];
    var spriteURL = SPRITE_IMG(a.id);
    // Static photo shows instantly; animated sprite swaps in once loaded.
    img.alt = a.th;
    img.style.display = "block";
    img.src = IMG(a.id);
    sprite.style.backgroundImage = 'url("' + spriteURL + '")';
    sprite.style.animation = "none";
    void sprite.offsetWidth;
    sprite.style.animation = "";
    var probe = new Image();
    probe.onload = function () { img.style.display = "none"; };
    probe.src = spriteURL;
    namepill.textContent = a.th;
    banner.textContent = "พบ" + a.th + "!";
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");
    spot.classList.remove("pop");
    void spot.offsetWidth;
    spot.classList.add("pop");
  }
  img.onerror = function () { spawn(); }; // skip any missing photo

  ball.addEventListener("click", spawn);
  ball.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); spawn(); }
  });

  spawn();
})();
</script>
</body>
</html>
