<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>จับสัตว์</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Tahoma, "Noto Sans Thai", sans-serif;
    background: #1d5c2a;
    color: #14213d;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  #game {
    position: relative;
    width: min(100%, 480px);
    height: 100vh;
    height: 100svh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,.35);
    background: #fffdf4;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: .6rem;
    padding: .55rem .8rem;
    background: #fffdf4;
    border-bottom: 3px solid #e45826;
    z-index: 6;
  }
  .back { text-decoration: none; font-size: 1.7rem; line-height: 1; color: #1769aa; font-weight: bold; padding: 0 .2rem; }
  h1 { margin: 0; font-size: 1.25rem; flex: 1; }
  .progress {
    background: #e45826; color: #fff; font-weight: bold;
    padding: .25rem .75rem; border-radius: 999px; font-size: 1rem;
  }

  /* ---------- collection tray ---------- */
  #tray {
    display: flex; gap: 6px; align-items: center;
    padding: .45rem .8rem;
    background: #fffdf4;
    border-bottom: 1px solid #e8e0cf;
    z-index: 6;
  }
  #tray .label { font-size: .82rem; color: #52647a; white-space: nowrap; }
  .slot {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px dashed #b9c8d8; background: #f2f6fa;
    display: grid; place-items: center; overflow: hidden;
    font-size: 0;
  }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* ---------- field ---------- */
  #field {
    position: relative; flex: 1; overflow: hidden;
    background: linear-gradient(180deg, #8fd45e 0%, #6fbf4a 30%, #57a83c 65%, #4a9334 100%);
    touch-action: manipulation;
  }
  #field::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at 50% 42%, transparent 55%, rgba(20,60,20,.32) 100%);
  }
  .treeline {
    position: absolute; top: -10px; left: 0; right: 0; z-index: 1;
    display: flex; justify-content: space-around; align-items: flex-end;
    pointer-events: none;
  }
  .tree-side { position: absolute; top: 5%; z-index: 1; pointer-events: none; }
  .tree-side.left { left: -16px; }
  .tree-side.right { right: -16px; }
  .tree-side svg { animation: sway 5.5s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
  .tuft { position: absolute; z-index: 2; pointer-events: none; opacity: .95; }
  .clearing {
    position: absolute; left: 50%; top: 32%; z-index: 2;
    width: min(84vw, 330px); height: min(30vw, 120px);
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse, rgba(255,255,255,.28), transparent 70%);
    pointer-events: none;
  }

  /* ---------- encounter banner ---------- */
  #banner {
    position: absolute; top: 14px; left: 50%; z-index: 4;
    transform: translateX(-50%) translateY(-90px);
    background: #fffdf4; border: 3px solid #e45826; border-radius: 999px;
    padding: .35rem 1.2rem; font-weight: bold; font-size: 1.05rem; white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none;
  }
  #banner.show { animation: bannerIn 2.2s ease forwards; }
  @keyframes bannerIn {
    0%   { opacity: 0; transform: translateX(-50%) translateY(-90px); }
    12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    80%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-34px); }
  }

  /* ---------- animal (transparent sprite, directly on grass) ---------- */
  #spot {
    position: absolute; left: 50%; top: 34%; z-index: 3;
    width: min(64vw, 280px); aspect-ratio: 1;
    transform: translate(-50%, -50%);
  }
  #sprite {
    width: 100%; height: 100%;
    background-size: 400% 100%;
    background-repeat: no-repeat;
    background-position-x: 0%;
    animation: hop 2.4s steps(1) infinite;
    filter: drop-shadow(0 10px 8px rgba(0,0,0,.25));
  }
  @keyframes hop {
    0%   { background-position-x: 0%; }
    15%  { background-position-x: 0%; }
    22%  { background-position-x: 33.3333%; }
    29%  { background-position-x: 66.6667%; }
    36%  { background-position-x: 100%; }
    92%  { background-position-x: 100%; }
    100% { background-position-x: 0%; }
  }
  #spot.pop { animation: pop .55s ease; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(0); } 60% { transform: translate(-50%,-50%) scale(1.12); } 100% { transform: translate(-50%,-50%) scale(1); } }
  #spot .shadow {
    position: absolute; top: calc(100% - 8px); left: 50%;
    width: 62%; height: 18px; transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(0,0,0,.3), transparent 70%);
    animation: shadowHop 2.4s ease-in-out infinite;
  }
  @keyframes shadowHop {
    0%, 12%  { transform: translateX(-50%) scale(1); opacity: .75; }
    24%      { transform: translateX(-50%) scale(.68); opacity: .4; }
    38%, 100% { transform: translateX(-50%) scale(1); opacity: .75; }
  }
  #namepill {
    position: absolute; top: calc(100% + 22px); left: 50%;
    transform: translateX(-50%);
    background: #fffdf4; border: 3px solid #1769aa; border-radius: 999px;
    padding: .3rem 1.3rem; font-size: 1.35rem; font-weight: bold; white-space: nowrap;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }

  /* ---------- pokeball (draggable, JS-positioned) ---------- */
  #ballzone {
    position: absolute; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center; z-index: 4; pointer-events: none;
  }
  #pokeball {
    width: 78px; height: 78px; border-radius: 50%;
    background: linear-gradient(180deg, #ee3e36 0 46%, #222 46% 54%, #f8f8f8 54% 100%);
    border: 4px solid #222;
    position: absolute; left: 0; top: 0; z-index: 4;
    cursor: grab;
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
    touch-action: none;
    will-change: transform;
  }
  #pokeball::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 22px; height: 22px; transform: translate(-50%,-50%);
    background: #fff; border: 4px solid #222; border-radius: 50%;
  }
  #pokeball.dragging { cursor: grabbing; }
  #hint {
    margin-top: 8px; color: #fff; font-size: .95rem;
    text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }
  .slot.filled {
    border: 2px solid #e45826; background-size: 400% 100%;
    background-position: 0% 0%; background-repeat: no-repeat;
  }
  .star {
    position: absolute; z-index: 10; font-size: 26px; pointer-events: none;
    transform: translate(-50%,-50%);
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    0% { transform: translate(-50%,-50%) scale(.3); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); opacity: 0; }
  }

  /* ---------- voice catch UI ---------- */
  #voiceui {
    position: absolute; left: 50%; bottom: 108px; z-index: 8;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,253,244,.97);
    border: 3px solid #1769aa; border-radius: 18px;
    padding: .7rem 1.2rem; text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    opacity: 0; pointer-events: none;
    transition: opacity .3s, transform .3s;
    max-width: 86%;
  }
  #voiceui.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #voiceui .mic { font-size: 2.2rem; animation: micpulse 1s ease-in-out infinite; }
  @keyframes micpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }
  #voiceui .voicetext { font-size: 1.25rem; font-weight: bold; margin-top: .2rem; }
  #voicetarget { color: #e45826; font-size: 1.6rem; }
  #voiceui .voiceheard { font-size: .95rem; color: #52647a; min-height: 1.4em; margin-top: .15rem; }
  #voiceui .voicetimer {
    height: 8px; background: #e8e0cf; border-radius: 99px; margin-top: .4rem; overflow: hidden;
  }
  #voicetimerbar { height: 100%; width: 100%; background: #2f7d32; border-radius: 99px; transition: width 1s linear; }
  #voiceui .voiceprivacy { font-size: .68rem; color: #8a99ad; margin-top: .35rem; }
  #voiceui.success .mic { animation: none; }
  .escapee {
    position: absolute; z-index: 8; width: 130px; height: 130px;
    transform: translate(-50%,-50%) scale(0);
    background-size: 400% 100%; background-position: 0% 0%; background-repeat: no-repeat;
    pointer-events: none;
    transition: transform .28s ease-out;
  }
  .escapee.out { transform: translate(-50%,-50%) scale(1); }

  @media (prefers-reduced-motion: reduce) {
    #sprite, #spot .shadow, .tree-side svg { animation: none; }
  }
</style>
</head>
<body>
<div id="game">
  <header>
    <a class="back" href="../" aria-label="กลับ">‹</a>
    <h1>⚾ จับสัตว์</h1>
    <div class="progress" id="progress">0/10</div>
  </header>
  <div id="tray"><span class="label">ที่จับได้:</span></div>

  <div id="field">
    <div class="treeline" id="treeline"></div>
    <div class="tree-side left" id="treeL"></div>
    <div class="tree-side right" id="treeR"></div>
    <div class="clearing"></div>
    <div id="banner"></div>

    <div id="spot">
      <div id="sprite" role="img" aria-label="สัตว์ป่า"></div>
      <div class="shadow"></div>
      <div id="namepill">…</div>
    </div>

    <div id="pokeball" role="button" tabindex="0" aria-label="ลากเพื่อโยนบอลจับสัตว์"></div>
    <div id="voiceui" aria-live="polite">
      <div class="mic">🎤</div>
      <div class="voicetext">พูดว่า <span id="voicetarget">…</span></div>
      <div class="voiceheard" id="voiceheard"></div>
      <div class="voicetimer"><div id="voicetimerbar"></div></div>
      <div class="voiceprivacy">เสียงจะถูกส่งให้ Google/Apple ช่วยฟังชื่อสัตว์</div>
    </div>
    <div id="ballzone">
      <div id="hint">ลากบอลขึ้นเพื่อโยน!</div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ANIMALS = [
    { id: "elephant",  th: "ช้าง" },
    { id: "tiger",     th: "เสือ" },
    { id: "lion",      th: "สิงโต" },
    { id: "dog",       th: "หมา" },
    { id: "cat",       th: "แมว" },
    { id: "bird",      th: "นก" },
    { id: "fish",      th: "ปลา" },
    { id: "monkey",    th: "ลิง" },
    { id: "rabbit",    th: "กระต่าย" },
    { id: "horse",     th: "ม้า" },
    { id: "cow",       th: "วัว" },
    { id: "pig",       th: "หมู" },
    { id: "chicken",   th: "ไก่" },
    { id: "duck",      th: "เป็ด" },
    { id: "butterfly", th: "ผีเสื้อ" }
  ];
  var SPRITE_IMG = function (id) {
    return "https://raw.githubusercontent.com/nopyyoyo/schoolgame/main/Small%20games/animal%20photo/" + id + "_sprite.png";
  };

  /* ---------- scenery ---------- */
  function treeSVG(c1, c2) {
    return '<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="44" y="82" width="12" height="48" rx="4" fill="#7a5230"/>' +
      '<circle cx="50" cy="52" r="34" fill="' + c1 + '"/>' +
      '<circle cx="28" cy="68" r="22" fill="' + c2 + '"/>' +
      '<circle cx="72" cy="68" r="22" fill="' + c2 + '"/>' +
      '<circle cx="50" cy="34" r="15" fill="' + c2 + '" opacity="0.65"/></svg>';
  }
  function tuftSVG() {
    return '<svg viewBox="0 0 40 32" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M6 32 Q9 18 5 6 M16 32 Q17 14 21 4 M26 32 Q27 16 33 8 M34 32 Q37 20 39 12"' +
      ' stroke="#3f8f31" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>';
  }

  var treeline = document.getElementById("treeline");
  var backTrees = [
    { w: 52, c: ["#2c6e2e", "#35823a"] }, { w: 66, c: ["#265e28", "#2f7d32"] },
    { w: 48, c: ["#2c6e2e", "#35823a"] }, { w: 62, c: ["#265e28", "#2f7d32"] },
    { w: 54, c: ["#2c6e2e", "#35823a"] }, { w: 60, c: ["#265e28", "#2f7d32"] }
  ];
  backTrees.forEach(function (t) {
    var s = document.createElement("span");
    s.innerHTML = treeSVG(t.c[0], t.c[1]);
    s.firstChild.setAttribute("width", t.w);
    s.firstChild.setAttribute("height", t.w * 1.4);
    treeline.appendChild(s);
  });
  document.getElementById("treeL").innerHTML = treeSVG("#2f7d32", "#3a9a40")
    .replace("<svg", '<svg width="104" height="146"');
  document.getElementById("treeR").innerHTML = treeSVG("#2f7d32", "#3a9a40")
    .replace("<svg", '<svg width="92" height="129"');

  var field = document.getElementById("field");
  var tuftSpots = [
    [6, 62], [20, 78], [36, 68], [55, 80], [70, 64], [84, 76], [12, 88], [46, 90], [78, 90]
  ];
  tuftSpots.forEach(function (p) {
    var d = document.createElement("div");
    d.className = "tuft";
    d.style.left = p[0] + "%";
    d.style.top = p[1] + "%";
    d.innerHTML = tuftSVG();
    field.appendChild(d);
  });

  /* ---------- collection tray (10 slots, filled in later steps) ---------- */
  var tray = document.getElementById("tray");
  for (var s = 0; s < 10; s++) {
    var slot = document.createElement("div");
    slot.className = "slot";
    tray.appendChild(slot);
  }

  /* ---------- sounds (Web Audio, no files needed) ---------- */
  var SFX = {
    ctx: null,
    ensure: function () {
      if (!this.ctx) {
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      if (this.ctx && this.ctx.state === "suspended") this.ctx.resume();
    },
    tone: function (freq, delay, dur, type, vol) {
      if (!this.ctx) return;
      var t = this.ctx.currentTime + delay;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + dur + 0.05);
    },
    encounter: function () {
      this.ensure();
      // cheerful "wild animal appeared!" arpeggio
      var notes = [523.25, 659.25, 783.99, 1046.5];
      for (var i = 0; i < notes.length; i++) {
        this.tone(notes[i], i * 0.09, 0.28, "triangle", 0.16);
      }
    },
    pop: function () {
      this.ensure();
      this.tone(620, 0, 0.07, "sine", 0.14);
      this.tone(930, 0.05, 0.09, "sine", 0.11);
    },
    throw_: function () {
      this.ensure();
      var t = this.ctx.currentTime;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(280, t);
      o.frequency.exponentialRampToValueAtTime(950, t + 0.22);
      g.gain.setValueAtTime(0.14, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t); o.stop(t + 0.32);
    },
    hit: function () {
      this.ensure();
      this.tone(180, 0, 0.14, "square", 0.2);
      this.tone(880, 0.08, 0.3, "sine", 0.14);
    },
    bounce: function () {
      this.ensure();
      this.tone(300, 0, 0.08, "sine", 0.1);
    },
    wiggle: function () {
      this.ensure();
      this.tone(520, 0, 0.07, "square", 0.1);
      this.tone(420, 0.07, 0.07, "square", 0.1);
    },
    caught: function () {
      this.ensure();
      var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      for (var i = 0; i < notes.length; i++) {
        this.tone(notes[i], i * 0.1, 0.32, "triangle", 0.16);
      }
    },
    miss: function () {
      this.ensure();
      this.tone(380, 0, 0.25, "sine", 0.11);
      this.tone(240, 0.18, 0.35, "sine", 0.11);
    },
    escape: function () {
      this.ensure();
      this.tone(520, 0, 0.18, "sine", 0.13);
      this.tone(380, 0.14, 0.22, "sine", 0.11);
      this.tone(240, 0.3, 0.35, "sine", 0.1);
    }
  };
  document.addEventListener("pointerdown", function () { SFX.ensure(); });

  /* ---------- encounters ---------- */
  var sprite = document.getElementById("sprite");
  var spot = document.getElementById("spot");
  var banner = document.getElementById("banner");
  var namepill = document.getElementById("namepill");
  var ball = document.getElementById("pokeball");

  var current = -1;
  function spawn() {
    var i;
    do { i = Math.floor(Math.random() * ANIMALS.length); } while (i === current);
    current = i;
    var a = ANIMALS[i];
    sprite.style.backgroundImage = 'url("' + SPRITE_IMG(a.id) + '")';
    sprite.style.animation = "none";
    void sprite.offsetWidth;
    sprite.style.animation = "";
    sprite.setAttribute("aria-label", a.th);
    namepill.textContent = a.th;
    banner.textContent = "พบ" + a.th + "!";
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");
    spot.classList.remove("pop");
    void spot.offsetWidth;
    spot.classList.add("pop");
    SFX.encounter();
  }

  /* ---------- ball throwing: drag, flick, arc, hit/miss (Step 2) ---------- */
  var field = document.getElementById("field");
  var hint = document.getElementById("hint");
  var progress = document.getElementById("progress");
  var BALL_R = 39;
  var GRAVITY = 1400;
  var HIT_RADIUS = 135;
  var ballState = "rest"; // rest | dragging | flying | catching | returning
  var bx = 0, by = 0, bvx = 0, bvy = 0;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function ballRest() {
    var fr = field.getBoundingClientRect();
    return { x: fr.width / 2, y: fr.height - 110 };
  }
  function placeBall(x, y) {
    bx = x; by = y;
    ball.style.transform = "translate3d(" + (x - BALL_R) + "px," + (y - BALL_R) + "px,0)";
  }
  function animalCenter() {
    var fr = field.getBoundingClientRect();
    var sr = spot.getBoundingClientRect();
    return { x: sr.left - fr.left + sr.width / 2, y: sr.top - fr.top + sr.height / 2 };
  }
  function starBurst(x, y) {
    for (var i = 0; i < 9; i++) {
      var s = document.createElement("div");
      s.className = "star";
      s.textContent = "⭐";
      s.style.left = x + "px";
      s.style.top = y + "px";
      var ang = (i / 9) * Math.PI * 2 + Math.random() * 0.5;
      var dist = 70 + Math.random() * 50;
      s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
      s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
      field.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 950); })(s);
    }
  }

  var caught = 0;
  function addToTray(animalId) {
    var slots = tray.querySelectorAll(".slot");
    if (caught < 10) {
      slots[caught].classList.add("filled");
      slots[caught].style.backgroundImage = 'url("' + SPRITE_IMG(animalId) + '")';
    }
    caught++;
    progress.textContent = Math.min(caught, 10) + "/10";
    if (caught >= 10) {
      setTimeout(function () {
        banner.textContent = "ครบ 10 ตัวแล้ว! เก่งมาก! 🎉";
        banner.classList.remove("show");
        void banner.offsetWidth;
        banner.classList.add("show");
        SFX.caught();
        setTimeout(function () {
          for (var i = 0; i < 10; i++) {
            slots[i].classList.remove("filled");
            slots[i].style.backgroundImage = "";
          }
          caught = 0;
          progress.textContent = "0/10";
        }, 2600);
      }, 1700);
    }
  }

  async function wiggleBall() {
    for (var i = 0; i < 3; i++) {
      ball.style.transform = "translate3d(" + (bx - BALL_R) + "px," + (by - BALL_R) + "px,0) rotate(-18deg)";
      await wait(140);
      ball.style.transform = "translate3d(" + (bx - BALL_R) + "px," + (by - BALL_R) + "px,0) rotate(18deg)";
      await wait(140);
    }
    ball.style.transform = "translate3d(" + (bx - BALL_R) + "px," + (by - BALL_R) + "px,0)";
  }
  function dropBallToGround() {
    return new Promise(function (resolve) {
      var fr = field.getBoundingClientRect();
      var groundY = fr.height - 52;
      var vy = 0, bounces = 0, last = performance.now();
      function step(t) {
        var dt = Math.min((t - last) / 1000, 0.033);
        last = t;
        vy += 2200 * dt;
        by += vy * dt;
        if (by >= groundY) {
          by = groundY;
          if (bounces < 2) { vy = -vy * 0.42; bounces++; SFX.bounce(); }
          else { placeBall(bx, by); resolve(); return; }
        }
        placeBall(bx, by);
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
  async function resetBall() {
    ballState = "returning";
    ball.style.transition = "opacity .3s";
    ball.style.opacity = "0";
    await wait(350);
    var rp = ballRest();
    placeBall(rp.x, rp.y);
    ball.style.opacity = "1";
    ball.style.transition = "";
    await wait(250);
    ballState = "rest";
  }

  /* ---------- Thai voice catch (Step 3) ---------- */
  var voiceui = document.getElementById("voiceui");
  var voicetarget = document.getElementById("voicetarget");
  var voiceheard = document.getElementById("voiceheard");
  var voicetimerbar = document.getElementById("voicetimerbar");
  var VOICE_MS = 10000;

  function levenshtein(a, b) {
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var d = [];
    for (var i = 0; i <= m; i++) d[i] = [i];
    for (var j = 0; j <= n; j++) d[0][j] = j;
    for (i = 1; i <= m; i++) {
      for (j = 1; j <= n; j++) {
        d[i][j] = Math.min(
          d[i - 1][j] + 1,
          d[i][j - 1] + 1,
          d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
        );
      }
    }
    return d[m][n];
  }
  function isLetterName(s) {
    // Thai alphabet letter name: consonant + "อ" (e.g. กอ, ชอ, สอ),
    // or just the bare consonant sound (e.g. ส) — not an animal name.
    var cons = "กขคฆงจฉชซฌญฎฏฐฑฒณดตถทธนบปผฝพฟภมยรลวศษสหฬอฮ";
    if (s.length === 2 && s.charAt(1) === "อ" && cons.indexOf(s.charAt(0)) !== -1) return true;
    if (s.length === 1 && cons.indexOf(s.charAt(0)) !== -1) return true;
    return false;
  }
  function voiceMatch(transcript, animal) {
    var t = (transcript || "").replace(/\s+/g, "").trim();
    var target = animal.th;
    if (!t) return false;
    if (t === target) return true;
    // Phrase contains the word — but reject if the extra is just a letter
    // name (e.g. "ชอช้าง" or "กอไก่" must NOT count, only "ช้าง"/"ไก่").
    if (t.length > target.length && t.indexOf(target) !== -1) {
      var leftover = t.split(target).join("");
      if (isLetterName(leftover)) return false;
      return true;
    }
    // Tolerance scales with word length: short words must be near-exact,
    // long words allow a tone mark or small slip.
    var maxDist;
    if (target.length <= 2) maxDist = 0;
    else if (target.length <= 4) maxDist = 1;
    else maxDist = 2;
    if (levenshtein(t, target) <= maxDist) return true;
    return false;
  }

  function voiceCatchPhase(animal) {
    return new Promise(function (resolve) {
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      var done = false;
      function finish(result) {
        if (done) return;
        done = true;
        voiceui.classList.remove("show");
        resolve(result);
      }
      if (!SR) { finish("no-mic"); return; }

      voicetarget.textContent = animal.th;
      voiceheard.textContent = "";
      voiceui.classList.remove("success");
      voiceui.classList.add("show");
      voicetimerbar.style.transition = "none";
      voicetimerbar.style.width = "100%";
      void voicetimerbar.offsetWidth;
      voicetimerbar.style.transition = "width " + (VOICE_MS / 1000) + "s linear";
      voicetimerbar.style.width = "0%";

      var rec;
      try { rec = new SR(); } catch (e) { finish("no-mic"); return; }
      rec.lang = "th-TH";
      rec.interimResults = true;
      rec.maxAlternatives = 3;

      var timer = setTimeout(function () {
        try { rec.stop(); } catch (e) {}
        clearInterval(wiggler);
        finish("escape");
      }, VOICE_MS);

      var wiggler = setInterval(function () {
        if (done) return;
        SFX.wiggle();
        wiggleBall();
      }, 1300);

      rec.onresult = function (e) {
        if (done) return;
        var txt = "";
        for (var i = e.resultIndex; i < e.results.length; i++) {
          txt += e.results[i][0].transcript;
        }
        txt = txt.trim();
        if (txt) voiceheard.textContent = "ได้ยิน: " + txt;
        if (voiceMatch(txt, animal)) {
          clearTimeout(timer);
          clearInterval(wiggler);
          try { rec.stop(); } catch (err) {}
          voiceui.classList.add("success");
          voiceheard.textContent = "ถูกต้อง! 🎉";
          SFX.pop();
          setTimeout(function () { finish("success"); }, 750);
        }
      };
      rec.onerror = function (e) {
        if (done) return;
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          clearTimeout(timer);
          clearInterval(wiggler);
          try { rec.stop(); } catch (err) {}
          finish("no-mic");
        }
      };
      rec.onend = function () {
        if (!done) {
          try { rec.start(); } catch (e) {}
        }
      };
      try { rec.start(); }
      catch (e) {
        clearTimeout(timer);
        clearInterval(wiggler);
        finish("no-mic");
      }
    });
  }

  async function doEscape(animalId) {
    SFX.escape();
    ball.style.transition = "transform .25s";
    ball.style.transform = "translate3d(" + (bx - BALL_R) + "px," + (by - BALL_R) + "px,0) scale(1.35)";
    await wait(280);
    ball.style.transition = "";
    ball.style.opacity = "0";
    var esc = document.createElement("div");
    esc.className = "escapee";
    esc.style.backgroundImage = 'url("' + SPRITE_IMG(animalId) + '")';
    esc.style.left = bx + "px";
    esc.style.top = (by - 20) + "px";
    field.appendChild(esc);
    await wait(60);
    esc.classList.add("out");
    SFX.pop();
    await wait(500);
    var dir = Math.random() < 0.5 ? -1 : 1;
    esc.style.transition = "transform .55s ease-in, opacity .55s";
    esc.style.transform = "translate(calc(-50% + " + (dir * 220) + "px), calc(-50% - 90px)) scale(.5)";
    esc.style.opacity = "0";
    await wait(600);
    esc.remove();
    banner.textContent = "โอ๊ะ! หนีไปแล้ว!";
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");
    hint.textContent = "ลองจับตัวใหม่นะ!";
    await wait(1100);
    spot.style.visibility = "";
    spot.style.transform = "";
    sprite.style.animationPlayState = "";
    await resetBall();
    hint.textContent = "ลากบอลขึ้นเพื่อโยน!";
    spawn();
  }

  async function onHit(ac) {
    ballState = "catching";
    SFX.hit();
    placeBall(ac.x, ac.y);
    sprite.style.animationPlayState = "paused";
    spot.style.transition = "transform .35s ease-in";
    spot.style.transform = "translate(-50%,-50%) scale(0)";
    await wait(400);
    spot.style.transition = "";
    spot.style.visibility = "hidden";
    await dropBallToGround();
    var result = await voiceCatchPhase(ANIMALS[current]);
    if (result === "escape") {
      await doEscape(ANIMALS[current].id);
      return;
    }
    if (result === "no-mic") {
      for (var i = 0; i < 2; i++) { SFX.wiggle(); await wiggleBall(); await wait(160); }
    }
    SFX.caught();
    starBurst(bx, by - 50);
    banner.textContent = "จับ" + ANIMALS[current].th + "ได้!";
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");
    addToTray(ANIMALS[current].id);
    await wait(1500);
    spot.style.visibility = "";
    spot.style.transform = "";
    sprite.style.animationPlayState = "";
    await resetBall();
    spawn();
  }
  async function onMiss() {
    ballState = "returning";
    SFX.miss();
    hint.textContent = "โอ๊ะ! ลองอีกครั้งนะ";
    ball.style.transition = "opacity .4s";
    ball.style.opacity = "0";
    await wait(450);
    var rp = ballRest();
    placeBall(rp.x, rp.y);
    ball.style.opacity = "1";
    ball.style.transition = "";
    hint.textContent = "ลากบอลขึ้นเพื่อโยน!";
    ballState = "rest";
  }

  var lastFlyT = 0;
  function flyStep(t) {
    if (ballState !== "flying") return;
    if (!lastFlyT) lastFlyT = t;
    var dt = Math.min((t - lastFlyT) / 1000, 0.033);
    lastFlyT = t;
    bvy += GRAVITY * dt;
    bx += bvx * dt;
    by += bvy * dt;
    placeBall(bx, by);
    var ac = animalCenter();
    var dx = bx - ac.x, dy = by - ac.y;
    if (dx * dx + dy * dy < HIT_RADIUS * HIT_RADIUS) {
      lastFlyT = 0;
      onHit(ac);
      return;
    }
    var fr = field.getBoundingClientRect();
    var groundY = fr.height - 52;
    if (by > fr.height + 60 || bx < -60 || bx > fr.width + 60 || (bvy > 0 && by >= groundY && Math.abs(bx - ac.x) > HIT_RADIUS)) {
      lastFlyT = 0;
      onMiss();
      return;
    }
    requestAnimationFrame(flyStep);
  }

  var dragTrail = [], dragStartT = 0, dragMoved = 0;
  ball.addEventListener("pointerdown", function (e) {
    if (ballState !== "rest") return;
    ballState = "dragging";
    try { ball.setPointerCapture(e.pointerId); } catch (err) {}
    dragTrail = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
    dragStartT = performance.now();
    dragMoved = 0;
    var fr = field.getBoundingClientRect();
    placeBall(e.clientX - fr.left, e.clientY - fr.top);
    ball.classList.add("dragging");
    e.preventDefault();
  });
  ball.addEventListener("pointermove", function (e) {
    if (ballState !== "dragging") return;
    var fr = field.getBoundingClientRect();
    var x = Math.max(BALL_R, Math.min(fr.width - BALL_R, e.clientX - fr.left));
    var y = Math.max(50, Math.min(fr.height - BALL_R, e.clientY - fr.top));
    dragMoved = Math.max(dragMoved, Math.abs(x - bx) + Math.abs(y - by));
    placeBall(x, y);
    dragTrail.push({ x: e.clientX, y: e.clientY, t: performance.now() });
    if (dragTrail.length > 8) dragTrail.shift();
  });
  function endDrag(e) {
    if (ballState !== "dragging") return;
    ball.classList.remove("dragging");
    var quickTap = (performance.now() - dragStartT < 350) && dragMoved < 14;
    if (quickTap) {
      ballState = "rest";
      var rp = ballRest();
      placeBall(rp.x, rp.y);
      SFX.pop();
      spawn();
      return;
    }
    var n = dragTrail.length;
    bvx = 0; bvy = 0;
    if (n >= 2) {
      var a = dragTrail[0], b = dragTrail[n - 1];
      var dt = (b.t - a.t) / 1000;
      if (dt > 0.02) {
        bvx = ((b.x - a.x) / dt) * 1.25;
        bvy = ((b.y - a.y) / dt) * 1.25;
      }
    }
    if (bvy < -350) {
      ballState = "flying";
      lastFlyT = 0;
      SFX.throw_();
      requestAnimationFrame(flyStep);
    } else {
      (async function () {
        ballState = "returning";
        var rp = ballRest();
        var sx = bx, sy = by, t0 = performance.now();
        await new Promise(function (res) {
          function s(t) {
            var k = Math.min((t - t0) / 250, 1);
            placeBall(sx + (rp.x - sx) * k, sy + (rp.y - sy) * k);
            if (k < 1) requestAnimationFrame(s); else res();
          }
          requestAnimationFrame(s);
        });
        ballState = "rest";
      })();
    }
  }
  ball.addEventListener("pointerup", endDrag);
  ball.addEventListener("pointercancel", function () {
    if (ballState === "dragging") {
      ball.classList.remove("dragging");
      var rp = ballRest();
      placeBall(rp.x, rp.y);
      ballState = "rest";
    }
  });
  ball.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && ballState === "rest") {
      e.preventDefault();
      var ac = animalCenter();
      var rp = ballRest();
      placeBall(rp.x, rp.y);
      ballState = "flying";
      bvx = (ac.x - rp.x) * 2.2;
      bvy = -950;
      lastFlyT = 0;
      SFX.throw_();
      requestAnimationFrame(flyStep);
    }
  });

  window.addEventListener("resize", function () {
    if (ballState === "rest") { var rp = ballRest(); placeBall(rp.x, rp.y); }
  });

  var rp0 = ballRest();
  placeBall(rp0.x, rp0.y);
  spawn();
})();
</script>
</body>
</html>
