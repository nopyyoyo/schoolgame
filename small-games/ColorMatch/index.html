<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#e9f6ff">
  <link rel="icon" href="data:,">
  <title>จับคู่สี</title>
  <style>
    :root { --sky:#e9f6ff; --paper:#fffdf7; --ink:#17304a; --muted:#52697d; --line:#bfd5e5; --blue:#1976b8; --blue-deep:#105786; --yellow:#ffd54a; --yellow-deep:#e5a700; --pink:#ef6e8f; --card-back-a:#1976b8; --card-back-b:#0f5f98; --shadow:rgba(26,72,105,.18); --overlay:rgba(18,42,61,.55); --good:#2e9b67; }
    @media (prefers-color-scheme:dark) { :root { --sky:#101c25; --paper:#172832; --ink:#f3f8fb; --muted:#bdd0dc; --line:#355265; --blue:#4ba5de; --blue-deep:#82c7ee; --yellow:#f3c946; --yellow-deep:#b68c0e; --pink:#ff88a4; --card-back-a:#247eb6; --card-back-b:#185b86; --shadow:rgba(0,0,0,.35); --overlay:rgba(2,8,12,.72); --good:#57c68a; } }
    * { box-sizing:border-box; }
    html { min-width:320px; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at 16px 16px,color-mix(in srgb,var(--blue) 12%,transparent) 2px,transparent 2.5px) 0 0/32px 32px,var(--sky); color:var(--ink); font-family:Tahoma,sans-serif; -webkit-tap-highlight-color:transparent; }
    button { font:inherit; }
    .page { width:min(100%,1040px); margin:0 auto; padding:max(14px,env(safe-area-inset-top)) 12px max(28px,env(safe-area-inset-bottom)); }
    .top { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; margin-bottom:12px; }
    h1 { margin:0; font-size:clamp(1.55rem,5vw,2.35rem); line-height:1.1; color:var(--blue-deep); }
    .pair-count { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
    .mode-switch { display:flex; gap:6px; padding:5px; border:1px solid var(--line); border-radius:14px; background:var(--paper); box-shadow:0 3px 10px var(--shadow); }
    .mode-btn { min-height:46px; padding:7px 11px; border:0; border-radius:10px; color:var(--ink); background:transparent; font-weight:700; cursor:pointer; white-space:nowrap; }
    .mode-btn[aria-pressed="true"] { background:var(--blue); color:#fff; box-shadow:inset 0 -3px 0 color-mix(in srgb,#000 18%,transparent); }
    .mode-btn:focus-visible,.card:focus-visible,.again:focus-visible { outline:4px solid var(--yellow); outline-offset:2px; }
    .game-info { min-height:66px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px; padding:10px 14px; border:1px solid var(--line); border-radius:16px 16px 10px 10px; background:var(--paper); box-shadow:0 4px 0 var(--line); text-align:center; }
    .solo-stat { font-size:1.08rem; font-weight:700; }
    .solo-stat strong { display:inline-block; min-width:2ch; color:var(--pink); font-size:1.35em; }
    .multi-stat { width:100%; }
    .scoreboard { display:flex; justify-content:center; flex-wrap:wrap; gap:6px 16px; font-size:.98rem; font-weight:700; }
    .scoreboard strong { color:var(--pink); }
    .turn { margin-top:4px; color:var(--blue-deep); font-size:1.06rem; font-weight:800; }
    [hidden] { display:none!important; }
    .board { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; width:100%; perspective:1000px; }
    .card { position:relative; aspect-ratio:1.45/1; min-width:0; padding:0; border:0; border-radius:11px; background:transparent; cursor:pointer; transform-style:preserve-3d; transition:transform .36s cubic-bezier(.2,.72,.3,1); }
    .card.flipped,.card.matched { transform:rotateY(180deg); }
    .card.matched { cursor:default; }
    .face { position:absolute; inset:0; display:grid; place-items:center; overflow:hidden; border-radius:inherit; backface-visibility:hidden; -webkit-backface-visibility:hidden; box-shadow:0 3px 7px var(--shadow); }
    .back { border:2px solid color-mix(in srgb,#fff 65%,var(--blue)); background:linear-gradient(135deg,transparent 36%,color-mix(in srgb,#fff 16%,transparent) 36% 46%,transparent 46% 54%,color-mix(in srgb,#fff 16%,transparent) 54% 64%,transparent 64%),var(--card-back-a); color:#fff; }
    .back::before { content:"?"; display:grid; place-items:center; width:45%; aspect-ratio:1; border:2px solid rgba(255,255,255,.85); border-radius:50%; background:var(--card-back-b); font-size:clamp(1.3rem,5vw,2.2rem); font-weight:900; line-height:1; box-shadow:0 2px 0 rgba(0,0,0,.16); }
    .front { transform:rotateY(180deg); border:2px solid var(--line); background:var(--paper); }
    .swatch { position:absolute; inset:5px; border-radius:7px; background:var(--swatch); }
    .swatch.white-swatch { border:3px solid #8193a0; }
    .word { display:flex; align-items:center; justify-content:center; width:calc(100% - 12px); height:calc(100% - 12px); padding:2px; color:var(--ink); font-size:30px; font-weight:800; line-height:1.1; white-space:nowrap; text-align:center; }
    .card.matched .front { border-color:var(--good); box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 35%,transparent),0 4px 8px var(--shadow); animation:happy .42s ease-out; }
    .card.matched::after { content:"★"; position:absolute; z-index:5; top:-8px; right:-4px; color:var(--yellow); font-size:22px; text-shadow:0 1px 2px rgba(0,0,0,.25); transform:rotateY(180deg); animation:star-pop .55s ease-out both; }
    @keyframes happy { 0%{transform:rotateY(180deg) scale(.9)} 60%{transform:rotateY(180deg) scale(1.08)} 100%{transform:rotateY(180deg) scale(1)} }
    @keyframes star-pop { 0%{opacity:0;translate:0 10px;scale:.4} 70%{opacity:1;translate:0 -4px;scale:1.2} 100%{opacity:1;translate:0 0;scale:1} }
    .win-layer { position:fixed; z-index:20; inset:0; display:grid; place-items:center; padding:20px; background:var(--overlay); }
    .win-box { width:min(100%,430px); padding:28px 20px 22px; border:4px solid var(--yellow); border-radius:22px; background:var(--paper); color:var(--ink); text-align:center; box-shadow:0 16px 44px rgba(0,0,0,.3); animation:win-in .4s cubic-bezier(.2,.9,.25,1.2); }
    .win-box::before { content:"★  ●  ★  ●  ★"; display:block; margin-bottom:10px; color:var(--pink); letter-spacing:5px; font-size:1.15rem; }
    .win-message { margin:0 0 6px; color:var(--blue-deep); font-size:clamp(1.8rem,8vw,2.7rem); line-height:1.2; }
    .win-detail { margin:0 0 18px; color:var(--muted); }
    .again { min-height:52px; padding:11px 24px; border:0; border-radius:13px; background:var(--yellow); color:#28313a; font-weight:800; font-size:1.08rem; box-shadow:0 4px 0 var(--yellow-deep); cursor:pointer; }
    .again:active { translate:0 2px; box-shadow:0 2px 0 var(--yellow-deep); }
    @keyframes win-in { from{opacity:0;transform:scale(.75) rotate(-2deg)} to{opacity:1;transform:scale(1) rotate(0)} }
    @media (min-width:560px) { .page{padding-inline:18px}.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.game-info{max-width:700px} }
    @media (min-width:820px) { .board{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.card{border-radius:14px} }
    @media (max-width:430px) { .top{grid-template-columns:1fr;gap:10px}.title-block{text-align:center}.mode-switch{width:100%}.mode-btn{flex:1 1 0}.page{padding-inline:8px}.game-info{margin-inline:4px}.board{gap:6px}.card{border-radius:9px}.word{width:calc(100% - 8px);height:calc(100% - 8px)} }
    @media (prefers-reduced-motion:reduce) { .card{transition-duration:.01ms}.card.matched .front,.card.matched::after,.win-box{animation:none} }
  </style>
</head>
<body>
  <main class="page">
    <section class="top" aria-label="ตัวเลือกเกม">
      <div class="title-block"><h1>จับคู่สี</h1><p class="pair-count">เปิดไพ่แล้วจับคู่สีกับคำภาษาไทย</p></div>
      <div class="mode-switch" role="group" aria-label="เลือกจำนวนผู้เล่น">
        <button class="mode-btn" type="button" data-mode="1" aria-pressed="true">👤 1 คน</button>
        <button class="mode-btn" type="button" data-mode="2" aria-pressed="false">👥 2 คน</button>
      </div>
    </section>
    <section class="game-info" aria-live="polite">
      <div class="solo-stat" id="soloStat">จำนวนครั้ง: <strong id="moves">0</strong></div>
      <div class="multi-stat" id="multiStat" hidden>
        <div class="scoreboard"><span>ผู้เล่น 1: <strong id="score1">0</strong> แต้ม</span><span>ผู้เล่น 2: <strong id="score2">0</strong> แต้ม</span></div>
        <div class="turn" id="turn">ตาของผู้เล่น 1</div>
      </div>
    </section>
    <section class="board" id="board" aria-label="ไพ่จับคู่สี"></section>
  </main>
  <div class="win-layer" id="winLayer" hidden role="dialog" aria-modal="true" aria-labelledby="winMessage">
    <div class="win-box"><h2 class="win-message" id="winMessage">🎉 เก่งมาก!</h2><p class="win-detail" id="winDetail"></p><button class="again" id="again" type="button">เล่นอีกครั้ง</button></div>
  </div>
  <script>
    (function(){
      'use strict';
      var colors=[
        {id:'red',word:'แดง',color:'#e53935'},{id:'green',word:'เขียว',color:'#35a853'},{id:'yellow',word:'เหลือง',color:'#ffd92f'},{id:'orange',word:'ส้ม',color:'#f28c28'},{id:'white',word:'ขาว',color:'#ffffff',white:true},{id:'black',word:'ดำ',color:'#16191c'},{id:'navy',word:'น้ำเงิน',color:'#1747a6'},{id:'sky',word:'ฟ้า',color:'#55c4ea'},{id:'purple',word:'ม่วง',color:'#8e4bb7'},{id:'pink',word:'ชมพู',color:'#f476a1'},{id:'brown',word:'น้ำตาล',color:'#89552f'}
      ];
      var board=document.getElementById('board'),movesEl=document.getElementById('moves'),soloStat=document.getElementById('soloStat'),multiStat=document.getElementById('multiStat'),score1El=document.getElementById('score1'),score2El=document.getElementById('score2'),turnEl=document.getElementById('turn'),winLayer=document.getElementById('winLayer'),winMessage=document.getElementById('winMessage'),winDetail=document.getElementById('winDetail'),again=document.getElementById('again'),modeButtons=Array.prototype.slice.call(document.querySelectorAll('.mode-btn'));
      var mode=1,first=null,second=null,locked=false,moves=0,matches=0,currentPlayer=1,scores=[0,0],audioCtx=null,flipTimer=null;
      function shuffle(items){for(var i=items.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),temp=items[i];items[i]=items[j];items[j]=temp}return items}
      function soundContext(){var AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return null;if(!audioCtx)audioCtx=new AudioCtor();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}
      function tone(frequency,start,duration,type,volume){var ctx=soundContext();if(!ctx)return;var osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type||'sine';osc.frequency.setValueAtTime(frequency,ctx.currentTime+start);gain.gain.setValueAtTime(.0001,ctx.currentTime+start);gain.gain.exponentialRampToValueAtTime(volume||.07,ctx.currentTime+start+.012);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+start+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(ctx.currentTime+start);osc.stop(ctx.currentTime+start+duration+.02)}
      function playFlip(){tone(520,0,.055,'square',.025)}
      function playMatch(){tone(523.25,0,.14,'sine',.075);tone(659.25,.08,.14,'sine',.075);tone(783.99,.16,.22,'sine',.08)}
      function playWin(){tone(523.25,0,.18,'triangle',.08);tone(659.25,.12,.18,'triangle',.08);tone(783.99,.24,.18,'triangle',.08);tone(1046.5,.38,.42,'triangle',.09)}
      function createDeck(){var deck=[];colors.forEach(function(item){deck.push({pair:item.id,type:'swatch',word:item.word,color:item.color,white:item.white});deck.push({pair:item.id,type:'word',word:item.word,color:item.color,white:item.white})});return shuffle(deck)}
      function cardLabel(card){return card.type==='word'?'คำว่า '+card.word:'แถบสี'}
      function makeCard(card,index){var button=document.createElement('button');button.type='button';button.className='card';button.dataset.pair=card.pair;button.dataset.type=card.type;button.dataset.index=String(index);button.setAttribute('aria-label','ไพ่คว่ำ ใบที่ '+(index+1));button.setAttribute('aria-pressed','false');var back=document.createElement('span');back.className='face back';back.setAttribute('aria-hidden','true');var front=document.createElement('span');front.className='face front';front.setAttribute('aria-hidden','true');if(card.type==='swatch'){var swatch=document.createElement('span');swatch.className='swatch'+(card.white?' white-swatch':'');swatch.style.setProperty('--swatch',card.color);front.appendChild(swatch)}else{var word=document.createElement('span');word.className='word';word.textContent=card.word;front.appendChild(word)}button.appendChild(back);button.appendChild(front);button._cardData=card;button.addEventListener('click',onCardClick);return button}
      function fitWords(){var words=board.querySelectorAll('.word');Array.prototype.forEach.call(words,function(el){var size=30;el.style.fontSize=size+'px';while(size>13&&(el.scrollWidth>el.clientWidth||el.scrollHeight>el.clientHeight)){size-=1;el.style.fontSize=size+'px'}})}
      function updateStats(){movesEl.textContent=String(moves);score1El.textContent=String(scores[0]);score2El.textContent=String(scores[1]);turnEl.textContent='ตาของผู้เล่น '+currentPlayer}
      function resetGame(){if(flipTimer)window.clearTimeout(flipTimer);first=null;second=null;locked=false;moves=0;matches=0;currentPlayer=1;scores=[0,0];winLayer.hidden=true;board.innerHTML='';createDeck().forEach(function(card,index){board.appendChild(makeCard(card,index))});updateStats();window.requestAnimationFrame(fitWords)}
      function reveal(card){card.classList.add('flipped');card.setAttribute('aria-pressed','true');card.setAttribute('aria-label',cardLabel(card._cardData)+': '+card._cardData.word)}
      function conceal(card){card.classList.remove('flipped');card.setAttribute('aria-pressed','false');card.setAttribute('aria-label','ไพ่คว่ำ ใบที่ '+(Number(card.dataset.index)+1))}
      function passTurn(){if(mode===2)currentPlayer=currentPlayer===1?2:1}
      function onCardClick(event){var card=event.currentTarget;soundContext();if(locked||card.classList.contains('flipped')||card.classList.contains('matched'))return;playFlip();reveal(card);if(!first){first=card;return}second=card;locked=true;moves+=1;updateStats();var isMatch=first.dataset.pair===second.dataset.pair&&first.dataset.type!==second.dataset.type;if(isMatch){first.classList.add('matched');second.classList.add('matched');first.disabled=true;second.disabled=true;first.setAttribute('aria-label','จับคู่แล้ว: '+first._cardData.word);second.setAttribute('aria-label','จับคู่แล้ว: '+second._cardData.word);matches+=1;if(mode===2)scores[currentPlayer-1]+=1;playMatch();passTurn();first=null;second=null;locked=false;updateStats();if(matches===colors.length)window.setTimeout(showWin,500)}else{var firstCard=first,secondCard=second;passTurn();updateStats();flipTimer=window.setTimeout(function(){conceal(firstCard);conceal(secondCard);first=null;second=null;locked=false},720)}}
      function showWin(){if(mode===1){winMessage.textContent='🎉 เก่งมาก!';winDetail.textContent='จับคู่ครบใน '+moves+' ครั้ง'}else{if(scores[0]>scores[1])winMessage.textContent='ผู้เล่น 1 ชนะ! 🎉';else if(scores[1]>scores[0])winMessage.textContent='ผู้เล่น 2 ชนะ! 🎉';else winMessage.textContent='เสมอกัน!';winDetail.textContent='ผู้เล่น 1: '+scores[0]+' แต้ม  •  ผู้เล่น 2: '+scores[1]+' แต้ม'}winLayer.hidden=false;playWin();again.focus()}
      modeButtons.forEach(function(button){button.addEventListener('click',function(){var nextMode=Number(button.dataset.mode);if(nextMode===mode)return;soundContext();mode=nextMode;modeButtons.forEach(function(item){item.setAttribute('aria-pressed',String(Number(item.dataset.mode)===mode))});soloStat.hidden=mode!==1;multiStat.hidden=mode!==2;resetGame()})});
      again.addEventListener('click',function(){soundContext();resetGame()});window.addEventListener('resize',fitWords);resetGame();
    }());
  </script>
</body>
</html>
