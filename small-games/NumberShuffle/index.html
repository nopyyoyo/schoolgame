<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>สุ่มตัวเลข</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8f3;
        --surface: #ffffff;
        --surface-soft: #edf2ea;
        --text: #17211b;
        --muted: #526158;
        --line: #cfd8d0;
        --accent: #e85d2a;
        --accent-dark: #a93510;
        --accent-soft: #fff0e8;
        --selected: #087f72;
        --selected-soft: #d9f2ed;
        --selected-text: #064f48;
        --off: #dfe4df;
        --off-text: #68716b;
        --danger: #b42318;
        --danger-bg: #fff0ee;
        --shadow: 0 14px 34px rgba(30, 48, 37, 0.12);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101713;
          --surface: #18221c;
          --surface-soft: #202d25;
          --text: #f4f7f2;
          --muted: #b8c4bb;
          --line: #3b4940;
          --accent: #ff7540;
          --accent-dark: #ff936b;
          --accent-soft: #3a2118;
          --selected: #54c7b8;
          --selected-soft: #153a34;
          --selected-text: #a8eee5;
          --off: #2e3932;
          --off-text: #98a39b;
          --danger: #ff9c91;
          --danger-bg: #3a1d1b;
          --shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
        }
      }

      * { box-sizing: border-box; }

      html { min-width: 280px; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: Tahoma, "Noto Sans Thai", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; }

      main {
        width: min(100%, 880px);
        margin: 0 auto;
        padding: clamp(18px, 4vw, 40px) clamp(14px, 4vw, 34px) calc(32px + env(safe-area-inset-bottom));
      }

      .stage {
        position: relative;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 28px 28px 12px 12px;
        box-shadow: var(--shadow);
        padding: clamp(22px, 5vw, 42px) 18px clamp(24px, 5vw, 38px);
        text-align: center;
      }

      .stage::before,
      .stage::after {
        content: "";
        position: absolute;
        border-radius: 999px;
        pointer-events: none;
      }

      .stage::before {
        width: 150px;
        height: 150px;
        left: -75px;
        top: -85px;
        background: var(--selected-soft);
      }

      .stage::after {
        width: 108px;
        height: 108px;
        right: -50px;
        bottom: -62px;
        background: var(--accent-soft);
      }

      h1 {
        position: relative;
        margin: 0;
        font-size: clamp(1.45rem, 5vw, 2.15rem);
        line-height: 1.25;
        font-weight: 800;
      }

      .instruction {
        position: relative;
        margin: 6px 0 0;
        color: var(--muted);
        font-size: clamp(0.92rem, 2.6vw, 1.05rem);
      }

      .result {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        width: clamp(172px, 46vw, 240px);
        aspect-ratio: 1;
        margin: clamp(18px, 4vw, 30px) auto 18px;
        background: var(--accent-soft);
        border: 3px solid var(--accent);
        border-radius: 50%;
      }

      .numeral {
        color: var(--accent-dark);
        font-size: clamp(4.8rem, 18vw, 8.5rem);
        font-weight: 800;
        line-height: 0.9;
        font-variant-numeric: tabular-nums;
      }

      .word {
        min-height: 1.4em;
        margin-top: 9px;
        color: var(--text);
        font-size: clamp(1.15rem, 4.5vw, 1.55rem);
        font-weight: 700;
        line-height: 1.3;
      }

      .shuffle-button {
        position: relative;
        min-width: 180px;
        min-height: 58px;
        border: 0;
        border-radius: 16px;
        background: var(--accent);
        color: #ffffff;
        box-shadow: 0 6px 0 var(--accent-dark);
        cursor: pointer;
        font-size: 1.35rem;
        font-weight: 800;
        transition: transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .shuffle-button:hover:not(:disabled) { filter: brightness(1.04); }

      .shuffle-button:active:not(:disabled) {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--accent-dark);
      }

      .shuffle-button:disabled {
        cursor: wait;
        opacity: 0.72;
      }

      .message {
        min-height: 1.45em;
        margin: 14px 0 0;
        color: var(--danger);
        font-weight: 700;
      }

      .pool {
        margin-top: clamp(20px, 4vw, 32px);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px 12px 24px 24px;
        box-shadow: var(--shadow);
        padding: clamp(18px, 4vw, 30px);
      }

      .pool-heading {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .pool-copy h2 {
        margin: 0;
        font-size: clamp(1.12rem, 3.5vw, 1.35rem);
        line-height: 1.3;
      }

      .pool-copy p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .count {
        flex: 0 0 auto;
        min-width: 72px;
        padding: 7px 10px;
        border-radius: 999px;
        background: var(--selected-soft);
        color: var(--selected-text);
        text-align: center;
        font-size: 0.86rem;
        font-weight: 800;
      }

      .number-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: clamp(7px, 1.8vw, 11px);
      }

      .number-tile {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        aspect-ratio: 1;
        padding: 5px;
        border: 2px solid var(--selected);
        border-radius: 14px;
        background: var(--selected-soft);
        color: var(--selected-text);
        cursor: pointer;
        font-size: clamp(1.32rem, 5vw, 2rem);
        font-weight: 800;
        line-height: 1;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease, transform 120ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      .number-tile:hover:not(:disabled) { transform: translateY(-2px); }

      .number-tile[aria-pressed="false"] {
        border-color: transparent;
        background: var(--off);
        color: var(--off-text);
        text-decoration: line-through;
        text-decoration-thickness: 2px;
      }

      .number-tile:disabled { cursor: wait; }

      .pool-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 18px;
      }

      .pool-action {
        min-height: 44px;
        padding: 9px 17px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface-soft);
        color: var(--text);
        cursor: pointer;
        font-weight: 700;
      }

      .pool-action:hover:not(:disabled) { border-color: var(--selected); }
      .pool-action:disabled { cursor: wait; opacity: 0.6; }

      button:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 3px;
      }

      .voice-row {
        display: flex;
        justify-content: center;
        margin-bottom: 14px;
      }

      .voice-toggle {
        min-height: 44px;
        padding: 8px 20px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
        cursor: pointer;
        font-size: 1rem;
        font-weight: 700;
        -webkit-tap-highlight-color: transparent;
      }

      .voice-toggle:active { transform: translateY(2px); }

      @media (max-width: 420px) {
        .stage { border-radius: 22px 22px 10px 10px; }
        .pool { border-radius: 10px 10px 20px 20px; }
        .number-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .pool-heading { align-items: center; }
        .pool-actions { display: grid; grid-template-columns: 1fr 1fr; }
        .pool-action { padding-inline: 8px; }
      }

      @media (max-width: 320px) {
        .number-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .pool-heading { align-items: start; }
        .count { min-width: 60px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="voice-row">
        <button id="voiceToggle" type="button" class="voice-toggle" aria-pressed="true">✅ เปิดเสียงอ่าน</button>
      </div>
      <section class="stage" aria-labelledby="page-title">
        <h1 id="page-title">สุ่มตัวเลข</h1>
        <p class="instruction">กดปุ่มเพื่อสุ่มเลขไทยจากตัวเลือกด้านล่าง</p>

        <div class="result" aria-live="polite" aria-atomic="true">
          <div class="numeral" id="numeral">๑</div>
          <div class="word" id="word">หนึ่ง</div>
        </div>

        <button class="shuffle-button" id="shuffle" type="button">สุ่ม!</button>
        <p class="message" id="message" role="status" aria-live="polite"></p>
      </section>

      <section class="pool" aria-labelledby="pool-title">
        <div class="pool-heading">
          <div class="pool-copy">
            <h2 id="pool-title">เลือกตัวเลขในกลุ่มสุ่ม</h2>
            <p>แตะตัวเลขเพื่อเปิดหรือปิด</p>
          </div>
          <div class="count" id="count">20 / 20</div>
        </div>

        <div class="number-grid" id="number-grid" aria-label="ตัวเลือกเลข 1 ถึง 20"></div>

        <div class="pool-actions">
          <button class="pool-action" id="select-all" type="button">เลือกทั้งหมด</button>
          <button class="pool-action" id="clear-all" type="button">ล้างทั้งหมด</button>
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var numbers = [
          { numeral: "๑", word: "หนึ่ง" },
          { numeral: "๒", word: "สอง" },
          { numeral: "๓", word: "สาม" },
          { numeral: "๔", word: "สี่" },
          { numeral: "๕", word: "ห้า" },
          { numeral: "๖", word: "หก" },
          { numeral: "๗", word: "เจ็ด" },
          { numeral: "๘", word: "แปด" },
          { numeral: "๙", word: "เก้า" },
          { numeral: "๑๐", word: "สิบ" },
          { numeral: "๑๑", word: "สิบเอ็ด" },
          { numeral: "๑๒", word: "สิบสอง" },
          { numeral: "๑๓", word: "สิบสาม" },
          { numeral: "๑๔", word: "สิบสี่" },
          { numeral: "๑๕", word: "สิบห้า" },
          { numeral: "๑๖", word: "สิบหก" },
          { numeral: "๑๗", word: "สิบเจ็ด" },
          { numeral: "๑๘", word: "สิบแปด" },
          { numeral: "๑๙", word: "สิบเก้า" },
          { numeral: "๒๐", word: "ยี่สิบ" }
        ];

        var enabled = numbers.map(function () { return true; });
        var grid = document.getElementById("number-grid");
        var numeral = document.getElementById("numeral");
        var word = document.getElementById("word");
        var count = document.getElementById("count");
        var message = document.getElementById("message");
        var shuffleButton = document.getElementById("shuffle");
        var selectAllButton = document.getElementById("select-all");
        var clearAllButton = document.getElementById("clear-all");
        var tiles = [];
        var audioContext = null;
        var shuffling = false;
        var voiceOn = true;

        /* ---------- built-in Thai voice (speechSynthesis) ---------- */
        var voiceToggle = document.getElementById("voiceToggle");
        var hasTTS = "speechSynthesis" in window;
        if (!hasTTS) {
          voiceToggle.style.display = "none";
        } else {
          voiceToggle.addEventListener("click", function () {
            voiceOn = !voiceOn;
            voiceToggle.textContent = voiceOn ? "✅ เปิดเสียงอ่าน" : "❌ ปิดเสียงอ่าน";
            voiceToggle.setAttribute("aria-pressed", voiceOn ? "true" : "false");
            if (!voiceOn) {
              try { window.speechSynthesis.cancel(); } catch (e) {}
            }
          });
          try {
            window.speechSynthesis.getVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
              window.speechSynthesis.onvoiceschanged = function () {
                window.speechSynthesis.getVoices();
              };
            }
          } catch (e) {}
        }
        function unlockTTS() {
          if (!hasTTS) return;
          try {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(" ");
            u.volume = 0;
            u.lang = "th-TH";
            window.speechSynthesis.speak(u);
          } catch (e) {}
        }
        function speak(text) {
          if (!voiceOn || !hasTTS) return;
          try {
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.lang = "th-TH";
            u.rate = 0.92;
            u.pitch = 1.05;
            u.volume = 1;
            var voices = window.speechSynthesis.getVoices();
            for (var i = 0; i < voices.length; i++) {
              if (voices[i].lang && voices[i].lang.toLowerCase().indexOf("th") === 0) {
                u.voice = voices[i];
                break;
              }
            }
            window.speechSynthesis.speak(u);
          } catch (e) {}
        }

        function createTiles() {
          numbers.forEach(function (number, index) {
            var button = document.createElement("button");
            button.type = "button";
            button.className = "number-tile";
            button.textContent = number.numeral;
            button.setAttribute("aria-pressed", "true");
            button.setAttribute("aria-label", number.word + " เลือกอยู่");
            button.addEventListener("click", function () {
              enabled[index] = !enabled[index];
              message.textContent = "";
              renderSelection();
            });
            tiles.push(button);
            grid.appendChild(button);
          });
        }

        function renderSelection() {
          var selectedCount = 0;
          enabled.forEach(function (isEnabled, index) {
            if (isEnabled) selectedCount += 1;
            tiles[index].setAttribute("aria-pressed", isEnabled ? "true" : "false");
            tiles[index].setAttribute("aria-label", numbers[index].word + (isEnabled ? " เลือกอยู่" : " ไม่ได้เลือก"));
          });
          count.textContent = selectedCount + " / 20";
        }

        function setControlsDisabled(disabled) {
          shuffleButton.disabled = disabled;
          selectAllButton.disabled = disabled;
          clearAllButton.disabled = disabled;
          tiles.forEach(function (tile) { tile.disabled = disabled; });
        }

        function ensureAudio() {
          if (!audioContext) {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioContext = new AudioContextClass();
          }
          if (audioContext && audioContext.state === "suspended") {
            audioContext.resume();
          }
        }

        function playTone(frequency, duration, volume, type, delay) {
          if (!audioContext || audioContext.state !== "running") return;
          var start = audioContext.currentTime + (delay || 0);
          var oscillator = audioContext.createOscillator();
          var gain = audioContext.createGain();
          oscillator.type = type || "sine";
          oscillator.frequency.setValueAtTime(frequency, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(start);
          oscillator.stop(start + duration + 0.02);
        }

        function playTick() {
          playTone(720, 0.055, 0.055, "sine", 0);
        }

        function playStop() {
          playTone(523.25, 0.32, 0.09, "sine", 0);
          playTone(659.25, 0.32, 0.075, "sine", 0.06);
          playTone(783.99, 0.42, 0.065, "sine", 0.12);
        }

        function showNumber(index) {
          numeral.textContent = numbers[index].numeral;
          word.textContent = numbers[index].word;
        }

        function randomFrom(pool) {
          return pool[Math.floor(Math.random() * pool.length)];
        }

        function runShuffle(pool) {
          var delays = [70, 70, 75, 80, 90, 105, 125, 150, 180, 220, 270, 330];
          var step = 0;
          var last = -1;

          function next() {
            var choice = randomFrom(pool);
            if (pool.length > 1) {
              while (choice === last) choice = randomFrom(pool);
            }
            last = choice;
            showNumber(choice);
            playTick();

            if (step < delays.length) {
              var wait = delays[step];
              step += 1;
              window.setTimeout(next, wait);
            } else {
              playStop();
              window.setTimeout(function () { speak(numbers[last].word); }, 550);
              shuffling = false;
              setControlsDisabled(false);
              shuffleButton.focus({ preventScroll: true });
            }
          }

          window.setTimeout(next, 70);
        }

        shuffleButton.addEventListener("click", function () {
          if (shuffling) return;
          var pool = [];
          enabled.forEach(function (isEnabled, index) {
            if (isEnabled) pool.push(index);
          });

          if (!pool.length) {
            message.textContent = "กรุณาเลือกอย่างน้อย 1 ตัวเลข";
            return;
          }

          ensureAudio();
          unlockTTS();
          message.textContent = "";
          shuffling = true;
          setControlsDisabled(true);
          runShuffle(pool);
        });

        selectAllButton.addEventListener("click", function () {
          enabled = numbers.map(function () { return true; });
          message.textContent = "";
          renderSelection();
        });

        clearAllButton.addEventListener("click", function () {
          enabled = numbers.map(function () { return false; });
          message.textContent = "";
          renderSelection();
        });

        createTiles();
        renderSelection();
      })();
    </script>
  </body>
</html>
